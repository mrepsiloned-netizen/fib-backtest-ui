<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07090f; color: #e6edf3; font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
select { appearance: none; -webkit-appearance: none; width: 100%; }
button { font-family: 'IBM Plex Mono', monospace; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #1c2433; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#00ff9d;font-family:monospace;font-size:14px;">Loading Backtest Lab...</div></div>
<script type="text/babel">

const { useState, useCallback } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer,
        CartesianGrid, ReferenceLine, BarChart, Bar } = Recharts;

const API = "https://web-production-6c4d6.up.railway.app";

const C = {
  bg:"#07090f", surface:"#0d1117", card:"#111820", border:"#1c2433",
  accent:"#00ff9d", accentDim:"#00ff9d15", red:"#ff4466", redDim:"#ff446615",
  gold:"#ffd666", text:"#e6edf3", muted:"#6e7681", dim:"#21262d",
};

const PAIRS     = ["INJ/USDT","BTC/USDT","ETH/USDT","SOL/USDT","BNB/USDT","XRP/USDT"];
const TIMEFRAMES = ["1h","4h","1d"];
const PERIODS   = [
  { label:"2025 Full",  start:"2025-01-01", end:"2026-01-01" },
  { label:"2026 YTD",   start:"2026-01-01", end:"now" },
  { label:"Rolling 1Y", start:null,         end:"now" },
];
const RISKS = [
  { value:"fixed",      label:"Fixed 2%",   desc:"Safe, consistent" },
  { value:"half_kelly", label:"Half Kelly",  desc:"Balanced aggressive" },
  { value:"full_kelly", label:"Full Kelly",  desc:"Maximum theoretical" },
];

const fmt     = (n, d=2) => Number(n).toFixed(d);
const fmtDate = (ts) => new Date(ts).toLocaleDateString("en-MY",{month:"short",day:"numeric"});

function StatCard({ label, value, sub, color }) {
  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px"}}>
      <div style={{fontSize:9,color:C.muted,letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:4}}>{label}</div>
      <div style={{fontSize:18,fontWeight:800,color:color||C.text,letterSpacing:"-0.02em"}}>{value}</div>
      {sub && <div style={{fontSize:10,color:C.muted,marginTop:2}}>{sub}</div>}
    </div>
  );
}

function Sel({ label, value, onChange, options }) {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase"}}>{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{
        background:C.card,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:6,padding:"8px 10px",fontSize:12,cursor:"pointer",outline:"none"
      }}>
        {options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
      </select>
    </div>
  );
}

const EqTip = ({active, payload}) => {
  if (!active || !payload?.length) return null;
  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:11}}>
      <div style={{color:C.muted}}>{fmtDate(payload[0].payload.t)}</div>
      <div style={{color:C.accent,fontWeight:700}}>${fmt(payload[0].payload.eq)}</div>
    </div>
  );
};

function App() {
  const [symbol,    setSymbol]   = useState("INJ/USDT");
  const [timeframe, setTf]       = useState("4h");
  const [period,    setPeriod]   = useState(0);
  const [risk,      setRisk]     = useState("fixed");
  const [pivotN,    setPivotN]   = useState(5);
  const [status,    setStatus]   = useState("idle");
  const [result,    setResult]   = useState(null);
  const [error,     setError]    = useState("");
  const [tab,       setTab]      = useState("curve");

  const run = useCallback(async () => {
    setStatus("loading"); setResult(null); setError("");
    try {
      const p = PERIODS[period];
      let start = p.start;
      if (!start) {
        const d = new Date(); d.setFullYear(d.getFullYear()-1);
        start = d.toISOString().split("T")[0];
      }
      const res = await fetch(`${API}/backtest`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          symbol, timeframe,
          start_date: start, end_date: p.end,
          pivot_n: pivotN, risk_method: risk, risk_pct: 0.02
        })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      setResult(data); setStatus("done");
    } catch(e) { setError(e.message); setStatus("error"); }
  }, [symbol, timeframe, period, risk, pivotN]);

  const s     = result?.stats;
  const green = s && s.total_return >= 0;
  const col   = green ? C.accent : C.red;

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,padding:"20px 16px",maxWidth:900,margin:"0 auto"}}>

      {/* Header */}
      <div style={{marginBottom:24}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,boxShadow:`0 0 8px ${C.accent}`}} />
          <span style={{fontSize:10,color:C.accent,letterSpacing:"0.2em",textTransform:"uppercase"}}>Fib Structure Engine</span>
        </div>
        <h1 style={{fontSize:26,fontWeight:800,letterSpacing:"-0.03em"}}>
          BACKTEST <span style={{color:C.accent}}>LAB</span>
        </h1>
        <p style={{marginTop:4,fontSize:11,color:C.muted}}>
          LH→LL→LH / HL→HH→HL · 61.8% Fib entry · 2R TP · Bias flip on SL
        </p>
      </div>

      {/* Controls */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Sel label="Pair"           value={symbol}   onChange={setSymbol}   options={PAIRS.map(p=>({value:p,label:p}))} />
          <Sel label="Timeframe"      value={timeframe} onChange={setTf}      options={TIMEFRAMES.map(t=>({value:t,label:t.toUpperCase()}))} />
          <Sel label="Period"         value={period}   onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))} />
          <Sel label="Pivot Lookback" value={pivotN}   onChange={v=>setPivotN(+v)} options={[{value:3,label:"3 — Sensitive"},{value:5,label:"5 — Balanced"},{value:8,label:"8 — Major"},{value:10,label:"10 — Structural"}]} />
        </div>

        {/* Risk method */}
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Risk Method</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {RISKS.map(m=>(
              <div key={m.value} onClick={()=>setRisk(m.value)} style={{
                background:risk===m.value?C.accentDim:C.card,
                border:`1px solid ${risk===m.value?C.accent:C.border}`,
                borderRadius:8,padding:"10px 8px",cursor:"pointer"
              }}>
                <div style={{fontSize:11,fontWeight:700,color:risk===m.value?C.accent:C.text,marginBottom:2}}>{m.label}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.desc}</div>
              </div>
            ))}
          </div>
        </div>

        <button onClick={run} disabled={status==="loading"} style={{
          background:status==="loading"?C.dim:C.accent,
          color:C.bg,border:"none",borderRadius:8,padding:12,
          fontSize:13,fontWeight:800,cursor:status==="loading"?"not-allowed":"pointer",
          letterSpacing:"0.08em",width:"100%"
        }}>
          {status==="loading" ? "⟳ RUNNING BACKTEST..." : "▶ RUN BACKTEST"}
        </button>

        {status==="error" && (
          <div style={{color:C.red,fontSize:11,textAlign:"center",marginTop:8}}>✗ {error}</div>
        )}
      </div>

      {/* Results */}
      {status==="done" && result && s && (
        <div>
          {/* Badges */}
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.muted}}>DATA: {result.source}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.muted}}>RISK: {result.risk_pct}% per trade</span>
          </div>

          {/* Banner */}
          <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em"}}>TOTAL RETURN</div>
              <div style={{fontSize:40,fontWeight:800,color:col,lineHeight:1}}>{green?"+":""}{fmt(s.total_return)}%</div>
            </div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:13,marginBottom:4}}>$100 → <strong style={{color:col}}>${fmt(s.final_equity)}</strong></div>
              <div style={{fontSize:11,color:C.muted}}>{s.total_trades} trades · {s.wins}W / {s.losses}L · {fmt(s.win_rate)}% WR</div>
              <div style={{fontSize:11,color:C.muted}}>CAGR {fmt(s.cagr)}% · Max DD -{fmt(s.max_drawdown)}% · Sharpe {fmt(s.sharpe)}</div>
            </div>
          </div>

          {/* Stat grid */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
            <StatCard label="Final Equity"   value={`$${fmt(s.final_equity)}`}    color={col} />
            <StatCard label="CAGR"           value={`${fmt(s.cagr)}%`}            color={C.gold} sub="annualised" />
            <StatCard label="Daily Avg"      value={`${fmt(s.daily_return,3)}%`} />
            <StatCard label="Win Rate"       value={`${fmt(s.win_rate)}%`}        sub={`${s.wins}W / ${s.losses}L`} />
            <StatCard label="Profit Factor"  value={fmt(s.profit_factor)}         color={s.profit_factor>=1.5?C.accent:C.red} />
            <StatCard label="Max Drawdown"   value={`-${fmt(s.max_drawdown)}%`}   color={C.red} />
            <StatCard label="Sharpe Ratio"   value={fmt(s.sharpe)}                color={s.sharpe>=1?C.accent:C.muted} />
            <StatCard label="Max Consec W"   value={s.max_consec_wins}            color={C.accent} />
            <StatCard label="Max Consec L"   value={s.max_consec_losses}          color={C.red} />
            <StatCard label="Avg Win $"      value={`$${fmt(s.avg_win,3)}`}       color={C.accent} />
            <StatCard label="Avg Loss $"     value={`$${fmt(s.avg_loss,3)}`}      color={C.red} />
            <StatCard label="Kelly Full"     value={`${fmt(s.kelly_full*100,1)}%`} color={C.gold} sub="optimal risk" />
          </div>

          {/* Chart tabs */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
            <div style={{display:"flex",borderBottom:`1px solid ${C.border}`}}>
              {[["curve","Equity"],["dd","Drawdown"],["pnl","PnL"]].map(([id,label])=>(
                <button key={id} onClick={()=>setTab(id)} style={{
                  flex:1,padding:"10px 8px",
                  background:tab===id?C.card:"transparent",
                  color:tab===id?C.accent:C.muted,border:"none",
                  borderBottom:tab===id?`2px solid ${C.accent}`:"2px solid transparent",
                  fontSize:10,cursor:"pointer",letterSpacing:"0.08em",textTransform:"uppercase"
                }}>{label}</button>
              ))}
            </div>
            <div style={{padding:"16px 8px"}}>
              {tab==="curve" && (
                <ResponsiveContainer width="100%" height={200}>
                  <AreaChart data={result.equity_curve} margin={{top:4,right:4,left:0,bottom:0}}>
                    <defs>
                      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%"  stopColor={col} stopOpacity={0.3}/>
                        <stop offset="95%" stopColor={col} stopOpacity={0}/>
                      </linearGradient>
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                    <XAxis dataKey="t" tickFormatter={fmtDate} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                    <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={44}/>
                    <Tooltip content={<EqTip/>}/>
                    <ReferenceLine y={100} stroke={C.muted} strokeDasharray="4 4"/>
                    <Area type="monotone" dataKey="eq" stroke={col} strokeWidth={2} fill="url(#grad)" dot={false}/>
                  </AreaChart>
                </ResponsiveContainer>
              )}
              {tab==="dd" && (
                <ResponsiveContainer width="100%" height={200}>
                  <AreaChart data={result.equity_curve.map((d,i,arr)=>{
                    const peak=Math.max(...arr.slice(0,i+1).map(x=>x.eq));
                    return {t:d.t, dd:-((peak-d.eq)/peak*100)};
                  })} margin={{top:4,right:4,left:0,bottom:0}}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                    <XAxis dataKey="t" tickFormatter={fmtDate} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                    <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>v.toFixed(0)+"%"} width={40}/>
                    <Tooltip formatter={v=>fmt(v)+"%"} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                    <Area type="monotone" dataKey="dd" stroke={C.red} strokeWidth={1.5} fill={C.redDim} dot={false}/>
                  </AreaChart>
                </ResponsiveContainer>
              )}
              {tab==="pnl" && (
                <ResponsiveContainer width="100%" height={200}>
                  <BarChart data={result.trades} margin={{top:4,right:4,left:0,bottom:0}}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                    <XAxis dataKey="id" tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false}/>
                    <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} width={44}/>
                    <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                    <ReferenceLine y={0} stroke={C.muted}/>
                    <Bar dataKey="pnl" fill={C.accent} radius={[2,2,0,0]}/>
                  </BarChart>
                </ResponsiveContainer>
              )}
            </div>
          </div>

          {/* Trade log */}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
            <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>
              Trade Log · Last {result.trades.length} trades
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead>
                  <tr style={{background:C.bg}}>
                    {["#","Dir","Date","Entry","SL","TP","Exit","Result","PnL","Equity"].map(h=>(
                      <th key={h} style={{padding:"7px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...result.trades].reverse().map(t=>(
                    <tr key={t.id} style={{borderTop:`1px solid ${C.border}`}}>
                      <td style={{padding:"6px 10px",color:C.muted}}>{t.id}</td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{background:t.direction==="LONG"?C.accentDim:C.redDim,color:t.direction==="LONG"?C.accent:C.red,padding:"2px 6px",borderRadius:3,fontSize:9,fontWeight:700}}>{t.direction}</span>
                      </td>
                      <td style={{padding:"6px 10px",color:C.muted}}>{new Date(t.entry_time).toLocaleDateString()}</td>
                      <td style={{padding:"6px 10px"}}>{t.entry}</td>
                      <td style={{padding:"6px 10px",color:C.red}}>{t.sl}</td>
                      <td style={{padding:"6px 10px",color:C.accent}}>{t.tp}</td>
                      <td style={{padding:"6px 10px"}}>{t.exit_price}</td>
                      <td style={{padding:"6px 10px",color:t.result==="TP"?C.accent:C.red,fontWeight:700}}>{t.result}</td>
                      <td style={{padding:"6px 10px",color:t.pnl>=0?C.accent:C.red}}>{t.pnl>=0?"+":""}{fmt(t.pnl)}</td>
                      <td style={{padding:"6px 10px"}}>${fmt(t.equity)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {status==="idle" && (
        <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>
          Configure above and hit <span style={{color:C.accent}}>▶ RUN BACKTEST</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
