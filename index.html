// ── MATRIX RUNNER TAB ─────────────────────────────────────────
function MatrixRunnerTab() {
  const [status,    setStatus]    = React.useState(null);
  const [starting,  setStarting]  = React.useState(false);
  const [prefetching,setPrefetching]=React.useState(false);
  const [startMsg,  setStartMsg]  = React.useState("");
  const [loading,   setLoading]   = React.useState(false);
  const [csvData,   setCsvData]   = React.useState("");
  const [polling,   setPolling]   = React.useState(false);
  const [filters,   setFilters]   = React.useState({min_return:0,min_sharpe:1,min_trades:30,max_dd:50});

  const fetchStatus = async () => {
    try {
      const res  = await fetch(`${API}/matrix-status`);
      const data = await res.json();
      setStatus(data);
    } catch(e) {}
  };

  React.useEffect(() => { fetchStatus(); }, []);
  React.useEffect(() => {
    if (!polling) return;
    const iv = setInterval(fetchStatus, 5000);
    return () => clearInterval(iv);
  }, [polling]);

  const startPrefetch = async () => {
    setPrefetching(true); setStartMsg("");
    try {
      const res  = await fetch(`${API}/prefetch-candles`, {method:"POST"});
      const data = await res.json();
      setStartMsg(data.message);
      if (data.success) { setPolling(true); fetchStatus(); }
    } catch(e) { setStartMsg("Error: "+e.message); }
    setPrefetching(false);
  };

  const startCompute = async () => {
    setStarting(true); setStartMsg("");
    try {
      const res  = await fetch(`${API}/run-matrix`, {method:"POST"});
      const data = await res.json();
      setStartMsg(data.message);
      if (data.success) { setPolling(true); fetchStatus(); }
    } catch(e) { setStartMsg("Error: "+e.message); }
    setStarting(false);
  };

  const downloadCSV = async () => {
    setLoading(true);
    try {
      const params = new URLSearchParams({
        min_return: filters.min_return,
        min_sharpe: filters.min_sharpe,
        min_trades: filters.min_trades,
        max_dd:     filters.max_dd,
      });
      const res = await fetch(`${API}/matrix-results/export?${params}`);
      if (!res.ok) { setLoading(false); return; }
      // Streaming response — get raw CSV text
      const csv  = await res.text();
      setCsvData(csv);
      const blob = new Blob([csv], {type:"text/csv"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = `waddle_matrix_${new Date().toISOString().split("T")[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const phase     = status?.phase || "";
  const isRunning = status?.is_running || false;
  const isDone    = status?.status === "done" && !isRunning;
  const pct       = status?.total > 0 ? Math.round((status.completed||0)/status.total*100) : 0;

  const VARS = [
    ["Pairs",      ["DOGE","XLM","XRP","ADA","TRX","ARB"]],
    ["Timeframes", ["5m","15m","1h"]],
    ["Engines",    ["BOS Pullback"]],
    ["Entry Modes",["Rejection","Reclaim"]],
    ["Pivot N",    [3,5,8]],
    ["RR Ratios",  [1.5,2.0,3.0,4.0]],
    ["Fib Levels", [0.382,0.5,0.618]],
    ["EMA Pairs",  ["Off","34/55","55/89","89/144","144/169"]],
    ["ADX Min",    ["Off(0)",15,25]],
    ["ATR SL",     ["P2","1 ATR","1.5 ATR","2 ATR","2.5 ATR","3 ATR"]],
  ];

  return (
    <div>
      {/* Status card */}
      <div style={{background:C.surface,border:`1px solid ${isDone?C.accent:isRunning?C.gold:C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <div style={{width:8,height:8,borderRadius:"50%",
            background:isDone?C.accent:isRunning?C.gold:C.muted,
            boxShadow:isRunning?`0 0 8px ${C.gold}`:isDone?`0 0 8px ${C.accent}`:"none"}}/>
          <span style={{fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",fontWeight:700,
            color:isDone?C.accent:isRunning?C.gold:C.muted}}>
            {isDone?"Complete":isRunning?`Running — ${phase==="prefetch"?"Fetching Candles":"Computing"}`:
             status?.status==="not_started"?"Not Started":"Idle"}
          </span>
          <button onClick={fetchStatus} style={{marginLeft:"auto",background:"transparent",
            border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",
            color:C.muted,fontSize:10,cursor:"pointer"}}>↻</button>
        </div>

        {status && status.total > 0 && (
          <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
              <StatCard label="Done"    value={(status.completed||0).toLocaleString()} color={C.accent}/>
              <StatCard label="Total"   value={(status.total||0).toLocaleString()}/>
              <StatCard label="Progress" value={`${pct}%`} color={isDone?C.accent:C.gold}/>
            </div>
            <div style={{background:C.dim,borderRadius:4,height:8,marginBottom:8}}>
              <div style={{background:isDone?C.accent:C.gold,height:8,borderRadius:4,
                width:`${pct}%`,transition:"width 1s"}}/>
            </div>
            {status.detail && (
              <div style={{fontSize:10,color:C.muted}}>
                {phase==="prefetch"?"📥 Fetching:":"🔢 Computing:"} {status.detail}
              </div>
            )}
          </div>
        )}

        {startMsg && <div style={{marginTop:10,fontSize:11,color:C.accent}}>{startMsg}</div>}

        <div style={{display:"flex",gap:8,marginTop:12}}>
          <button onClick={()=>setPolling(!polling)} style={{
            flex:1,background:polling?C.goldDim:C.card,color:polling?C.gold:C.muted,
            border:`1px solid ${polling?C.gold:C.border}`,borderRadius:6,
            padding:"8px 12px",fontSize:10,cursor:"pointer"
          }}>{polling?"⏸ Stop Refresh":"▶ Auto Refresh (5s)"}</button>
        </div>
      </div>

      {/* Action buttons */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        <button onClick={startPrefetch} disabled={prefetching||isRunning} style={{
          background:prefetching||isRunning?C.dim:C.gold,color:C.bg,border:"none",
          borderRadius:8,padding:12,fontSize:11,fontWeight:800,
          cursor:prefetching||isRunning?"not-allowed":"pointer",letterSpacing:"0.06em"
        }}>{prefetching?"⟳ Starting...":isRunning&&phase==="prefetch"?"⟳ Fetching...":"📥 PREFETCH CANDLES"}</button>
        <button onClick={startCompute} disabled={starting||isRunning} style={{
          background:starting||isRunning?C.dim:C.accent,color:C.bg,border:"none",
          borderRadius:8,padding:12,fontSize:11,fontWeight:800,
          cursor:starting||isRunning?"not-allowed":"pointer",letterSpacing:"0.06em"
        }}>{starting?"⟳ Starting...":isRunning&&phase==="compute"?"⟳ Running...":"▶ RUN COMPUTATION"}</button>
      </div>

      {/* Variable space */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>
          Variables Being Tested
          <span style={{marginLeft:8,color:C.accent,fontSize:11,fontWeight:700}}>
            19,440 combos
          </span>
        </div>
        {VARS.map(([label,vals])=>(
          <div key={label} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:8,
            paddingBottom:8,borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontSize:9,color:C.muted,width:80,flexShrink:0,paddingTop:3,
              textTransform:"uppercase",letterSpacing:"0.08em"}}>{label}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {vals.map(v=>(
                <span key={v} style={{background:C.card,border:`1px solid ${C.border}`,
                  borderRadius:4,padding:"2px 7px",fontSize:10,color:C.text}}>{v}</span>
              ))}
            </div>
          </div>
        ))}
        <div style={{marginTop:8,fontSize:10,color:C.muted}}>
          Period: 2025-01-01 → 2026-01-01 · Risk: Fixed 2% · Fees: Bybit notional
        </div>
      </div>

      {/* Filter + Download */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
        <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>
          Filter & Download CSV
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[
            ["Min Return %","min_return",[0,10,20,50,100]],
            ["Min Sharpe",  "min_sharpe",[0,1,2,3,4]],
            ["Min Trades",  "min_trades",[0,20,30,50,100]],
            ["Max DD %",    "max_dd",   [100,50,40,30,20]],
          ].map(([label,key,opts])=>(
            <div key={key}>
              <div style={{fontSize:9,color:C.muted,marginBottom:6}}>{label}</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {opts.map(v=>(
                  <div key={v} onClick={()=>setFilters({...filters,[key]:v})} style={{
                    background:filters[key]===v?C.accentDim:C.card,
                    border:`1px solid ${filters[key]===v?C.accent:C.border}`,
                    borderRadius:4,padding:"4px 8px",cursor:"pointer",
                    fontSize:10,color:filters[key]===v?C.accent:C.text
                  }}>{v}</div>
                ))}
              </div>
            </div>
          ))}
        </div>
        <div style={{fontSize:10,color:C.muted,marginBottom:8}}>
          CSV includes: Pair · TF · Engine · Entry · N · RR · Fib · EMA · ADX ·
          Return% · CAGR · MaxDD · Sharpe · PF · WR · Trades · Wins · Losses ·
          AvgWin · AvgLoss · Kelly · Fees · Period
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <button onClick={downloadCSV} disabled={loading} style={{
            background:loading?C.dim:C.accent,color:C.bg,border:"none",borderRadius:8,
            padding:12,fontSize:12,fontWeight:800,
            cursor:loading?"not-allowed":"pointer",letterSpacing:"0.06em"
          }}>{loading?"⟳ Loading...":"⬇ FILTERED CSV"}</button>
          <button onClick={async()=>{
            setLoading(true);
            try {
              const res = await fetch(`${API}/matrix-results/all`);
              const csv = await res.text();
              setCsvData(csv);
              const blob=new Blob([csv],{type:"text/csv"});
              const url=URL.createObjectURL(blob);
              const a=document.createElement("a");
              a.href=url;
              a.download=`waddle_matrix_all_${new Date().toISOString().split("T")[0]}.csv`;
              a.click();
              URL.revokeObjectURL(url);
            } catch(e){console.error(e);}
            setLoading(false);
          }} disabled={loading} style={{
            background:loading?C.dim:C.gold,color:C.bg,border:"none",borderRadius:8,
            padding:12,fontSize:12,fontWeight:800,
            cursor:loading?"not-allowed":"pointer",letterSpacing:"0.06em"
          }}>{loading?"⟳ Loading...":"⬇ ALL RESULTS"}</button>
        </div>
        {csvData && (
          <div style={{marginTop:8,fontSize:10,color:C.accent,textAlign:"center"}}>
            ✓ Downloaded — check your downloads folder
          </div>
        )}
      </div>
    </div>
  );
}

      </div>

      {mainTab==="single"   && <SingleTab/>}
      {mainTab==="prefetch" && <PrefetchTab/>}
      {mainTab==="runner"   && <MatrixRunnerTab/>}
      {mainTab==="journal"  && <JournalTab/>}
      {mainTab==="live"     && <LiveJournalTab/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
