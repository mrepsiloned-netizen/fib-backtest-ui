<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07090f; color: #e6edf3; font-family: 'IBM Plex Mono', monospace; }
select { appearance: none; -webkit-appearance: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Wait for all scripts to load
window.onload = function() {
  console.log("React:", typeof React);
  console.log("ReactDOM:", typeof ReactDOM);
  console.log("Recharts:", typeof Recharts);
  
  if(typeof React === "undefined") {
    document.getElementById("root").innerHTML = "<p style='color:red;padding:20px'>React failed to load</p>";
    return;
  }
  if(typeof Recharts === "undefined") {
    document.getElementById("root").innerHTML = "<p style='color:orange;padding:20px'>Recharts failed to load — continuing without charts</p>";
  }
  
  document.getElementById("root").innerHTML = "<p style='color:#00ff9d;padding:20px;font-family:monospace'>✓ Scripts loaded — initializing app...</p>";
}
</script>
</body>
</html>
