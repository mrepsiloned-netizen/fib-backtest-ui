<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07090f; color: #e6edf3; font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
select { appearance: none; -webkit-appearance: none; width: 100%; }
button { font-family: 'IBM Plex Mono', monospace; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #1c2433; border-radius: 2px; }
.sortable { cursor: pointer; user-select: none; }
.sortable:hover { color: #00ff9d !important; }
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#00ff9d;font-family:monospace;">Loading...</div></div>
<script type="text/babel">

const { useState, useCallback, useMemo, useEffect } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, ReferenceLine, BarChart, Bar } = Recharts;

const API = "https://web-production-85d80.up.railway.app";

const C = {
  bg:"#07090f", surface:"#0d1117", card:"#111820", border:"#1c2433",
  accent:"#00ff9d", accentDim:"#00ff9d15", red:"#ff4466", redDim:"#ff446615",
  gold:"#ffd666", goldDim:"#ffd66615", blue:"#3b8bff", blueDim:"#3b8bff15",
  text:"#e6edf3", muted:"#6e7681", dim:"#21262d",
};

const ALL_PAIRS      = ["INJ/USDT","BTC/USDT","ETH/USDT","SOL/USDT","BNB/USDT","XRP/USDT"];
const ALL_TIMEFRAMES = ["1m","5m","15m","1h","4h","1d"];
const ALL_RISKS      = ["fixed","half_kelly","full_kelly"];
const ALL_PIVOTS     = [3,5,8];
const ALL_RR         = [1.5,2,3,4];
const ALL_FIBS       = [0.382, 0.5, 0.618];
const PERIODS = [
  { label:"Last 7 Days",  start:null, end:"now", days:7 },
  { label:"Last 30 Days", start:null, end:"now", days:30 },
  { label:"Last 90 Days", start:null, end:"now", days:90 },
  { label:"2025 Full",    start:"2025-01-01", end:"2026-01-01", days:365 },
  { label:"2026 YTD",     start:"2026-01-01", end:"now", days:null },
  { label:"Rolling 1Y",   start:null, end:"now", days:365 },
];
const RISK_LABELS = { fixed:"Fixed 2%", half_kelly:"Half Kelly", full_kelly:"Full Kelly" };

const fmt     = (n,d=2) => Number(n).toFixed(d);
const fmtDate = (ts) => new Date(ts).toLocaleDateString("en-MY",{month:"short",day:"numeric"});
const fmtRisk = (r) => RISK_LABELS[r]||r;

function getPeriodDates(p) {
  if (!p) return { start: "2025-01-01", end: "2026-01-01" };
  const now = new Date();
  if (p.start) return { start: p.start, end: p.end };
  if (p.days) {
    const d = new Date(now.getTime() - p.days * 86400000);
    return { start: d.toISOString().split("T")[0], end: "now" };
  }
  return { start: "2025-01-01", end: "now" };
}

// ── SHARED COMPONENTS ─────────────────────────────────────
function StatCard({label,value,sub,color}){
  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px"}}>
      <div style={{fontSize:9,color:C.muted,letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:4}}>{label}</div>
      <div style={{fontSize:18,fontWeight:800,color:color||C.text,letterSpacing:"-0.02em"}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:C.muted,marginTop:2}}>{sub}</div>}
    </div>
  );
}

function Sel({label,value,onChange,options}){
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase"}}>{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{
        background:C.card,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:6,padding:"8px 10px",fontSize:12,cursor:"pointer",outline:"none"
      }}>
        {options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
      </select>
    </div>
  );
}

function Toggle({label,value,onChange}){
  return (
    <div onClick={()=>onChange(!value)} style={{
      background:value?C.accentDim:C.card,
      border:`1px solid ${value?C.accent:C.border}`,
      borderRadius:6,padding:"6px 10px",cursor:"pointer",
      display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"
    }}>
      <div style={{width:7,height:7,borderRadius:"50%",background:value?C.accent:C.muted,flexShrink:0}}/>
      <span style={{fontSize:11,color:value?C.accent:C.muted}}>{label}</span>
    </div>
  );
}

function ProgressBar({value,total}){
  const pct = total?(value/total*100):0;
  return (
    <div style={{marginTop:10,background:C.dim,borderRadius:4,height:4}}>
      <div style={{background:C.accent,height:4,borderRadius:4,width:`${pct}%`,transition:"width 0.3s"}}/>
    </div>
  );
}

const EqTip = ({active,payload}) => {
  if(!active||!payload?.length) return null;
  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:11}}>
      <div style={{color:C.muted}}>{fmtDate(payload[0].payload.t)}</div>
      <div style={{color:C.accent,fontWeight:700}}>${fmt(payload[0].payload.eq)}</div>
    </div>
  );
};

function toggle(arr,val){ return arr.includes(val)?arr.filter(x=>x!==val):[...arr,val]; }

// ── SINGLE TAB ────────────────────────────────────────────
function SingleTab(){
  const [symbol,setSymbol]         = useState("SOL/USDT");
  const [tf,setTf]                 = useState("1m");
  const [period,setPeriod]         = useState(3);
  const [risk,setRisk]             = useState("fixed");
  const [pivotN,setPivotN]         = useState(3);
  const [rr,setRr]                 = useState(1.5);
  const [fibLevel,setFibLevel]     = useState(0.618);
  const [minSwing,setMinSwing]     = useState(0.002);
  const [stopBuf,setStopBuf]       = useState(0.001);
  const [kStale,setKStale]         = useState(0);
  const [entryMode,setEntryMode]   = useState("rejection");
  const [engine,setEngine]         = useState("structure");
  const [showAdv,setShowAdv]       = useState(false);
  const [status,setStatus]         = useState("idle");
  const [result,setResult]         = useState(null);
  const [error,setError]           = useState("");
  const [tab,setTab]               = useState("curve");

  const run = useCallback(async()=>{
    setStatus("loading"); setResult(null); setError("");
    try{
      const {start,end} = getPeriodDates(PERIODS[period]);
      const res=await fetch(`${API}/backtest`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          symbol,timeframe:tf,start_date:start,end_date:end,
          pivot_n:pivotN,risk_method:risk,risk_pct:0.02,rr,fib_level:fibLevel,
          min_swing_pct:minSwing,stop_buffer_pct:stopBuf,k_stale:kStale,
          entry_mode:entryMode,engine:engine
        })});
      const data=await res.json();
      if(!data.success) throw new Error(data.error);
      setResult(data); setStatus("done");
    }catch(e){setError(e.message);setStatus("error");}
  },[symbol,tf,period,risk,pivotN,rr,fibLevel,minSwing,stopBuf,kStale,entryMode,engine]);

  const s=result?.stats, green=s&&s.total_return>=0, col=green?C.accent:C.red;

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Sel label="Pair"      value={symbol}  onChange={setSymbol}        options={ALL_PAIRS.map(p=>({value:p,label:p}))}/>
          <Sel label="Timeframe" value={tf}      onChange={setTf}            options={ALL_TIMEFRAMES.map(t=>({value:t,label:t.toUpperCase()}))}/>
          <Sel label="Period"    value={period}  onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))}/>
          <Sel label="Pivot N"   value={pivotN}  onChange={v=>setPivotN(+v)} options={ALL_PIVOTS.map(n=>({value:n,label:`N=${n}`}))}/>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Fib Level</span>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ALL_FIBS.map(f=>(
              <div key={f} onClick={()=>setFibLevel(f)} style={{
                background:fibLevel===f?C.accentDim:C.card,border:`1px solid ${fibLevel===f?C.accent:C.border}`,
                borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,
                color:fibLevel===f?C.accent:C.text,fontWeight:fibLevel===f?700:400
              }}>{f}</div>
            ))}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Risk:Reward</span>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ALL_RR.map(r=>(
              <div key={r} onClick={()=>setRr(r)} style={{
                background:rr===r?C.accentDim:C.card,border:`1px solid ${rr===r?C.accent:C.border}`,
                borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,
                color:rr===r?C.accent:C.text,fontWeight:rr===r?700:400
              }}>{r}R</div>
            ))}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Risk Method</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[{value:"fixed",label:"Fixed 2%",desc:"Safe"},{value:"half_kelly",label:"Half Kelly",desc:"Balanced"},{value:"full_kelly",label:"Full Kelly",desc:"Max"}].map(m=>(
              <div key={m.value} onClick={()=>setRisk(m.value)} style={{
                background:risk===m.value?C.accentDim:C.card,
                border:`1px solid ${risk===m.value?C.accent:C.border}`,
                borderRadius:8,padding:"10px 8px",cursor:"pointer"
              }}>
                <div style={{fontSize:11,fontWeight:700,color:risk===m.value?C.accent:C.text,marginBottom:2}}>{m.label}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Engine */}
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Engine</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[
              {value:"classic",    label:"Classic",    desc:"P1→P3 fixed fib"},
              {value:"classic_v2", label:"Classic V2", desc:"+ re-base + stale"},
              {value:"structure",  label:"Structure",  desc:"Floating P3 state machine"},
            ].map(m=>(
              <div key={m.value} onClick={()=>setEngine(m.value)} style={{
                background:engine===m.value?C.accentDim:C.card,
                border:`1px solid ${engine===m.value?C.accent:C.border}`,
                borderRadius:8,padding:"10px 8px",cursor:"pointer"
              }}>
                <div style={{fontSize:11,fontWeight:700,color:engine===m.value?C.accent:C.text,marginBottom:2}}>{m.label}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Entry Mode */}
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Entry Mode</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[
              {value:"touch",    label:"Touch",     desc:"Fib hit = fill"},
              {value:"rejection",label:"Rejection",  desc:"Wick + close back"},
              {value:"reclaim",  label:"Reclaim",    desc:"Close through, recover 2c"},
            ].map(m=>(
              <div key={m.value} onClick={()=>setEntryMode(m.value)} style={{
                background:entryMode===m.value?C.accentDim:C.card,
                border:`1px solid ${entryMode===m.value?C.accent:C.border}`,
                borderRadius:8,padding:"10px 8px",cursor:"pointer"
              }}>
                <div style={{fontSize:11,fontWeight:700,color:entryMode===m.value?C.accent:C.text,marginBottom:2}}>{m.label}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Advanced params toggle */}
        <div onClick={()=>setShowAdv(!showAdv)} style={{
          display:"flex",alignItems:"center",gap:6,cursor:"pointer",
          marginBottom:showAdv?12:0,color:C.muted,fontSize:10,letterSpacing:"0.08em"
        }}>
          <span style={{color:showAdv?C.accent:C.muted}}>{showAdv?"▾":"▸"}</span>
          ADVANCED PARAMS
        </div>
        {showAdv&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14,
            background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:12}}>
            <div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.1em",marginBottom:4}}>MIN SWING %</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {[0.001,0.002,0.003,0.005].map(v=>(
                  <div key={v} onClick={()=>setMinSwing(v)} style={{
                    background:minSwing===v?C.accentDim:C.card,border:`1px solid ${minSwing===v?C.accent:C.border}`,
                    borderRadius:4,padding:"4px 8px",cursor:"pointer",fontSize:10,
                    color:minSwing===v?C.accent:C.text
                  }}>{(v*100).toFixed(1)}%</div>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.1em",marginBottom:4}}>SL BUFFER %</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {[0,0.001,0.002,0.005].map(v=>(
                  <div key={v} onClick={()=>setStopBuf(v)} style={{
                    background:stopBuf===v?C.accentDim:C.card,border:`1px solid ${stopBuf===v?C.accent:C.border}`,
                    borderRadius:4,padding:"4px 8px",cursor:"pointer",fontSize:10,
                    color:stopBuf===v?C.accent:C.text
                  }}>{v===0?"None":(v*100).toFixed(1)+"%"}</div>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:"0.1em",marginBottom:4}}>K STALE (candles)</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {[0,10,20,50].map(v=>(
                  <div key={v} onClick={()=>setKStale(v)} style={{
                    background:kStale===v?C.accentDim:C.card,border:`1px solid ${kStale===v?C.accent:C.border}`,
                    borderRadius:4,padding:"4px 8px",cursor:"pointer",fontSize:10,
                    color:kStale===v?C.accent:C.text
                  }}>{v===0?"Off":v}</div>
                ))}
              </div>
            </div>
          </div>
        )}

        <button onClick={run} disabled={status==="loading"} style={{
          background:status==="loading"?C.dim:C.accent,color:C.bg,border:"none",
          borderRadius:8,padding:12,fontSize:13,fontWeight:800,
          cursor:status==="loading"?"not-allowed":"pointer",letterSpacing:"0.08em",width:"100%"
        }}>{status==="loading"?"⟳ RUNNING...":"▶ RUN BACKTEST"}</button>
        {status==="error"&&<div style={{color:C.red,fontSize:11,textAlign:"center",marginTop:8}}>✗ {error}</div>}
      </div>

      {status==="done"&&result&&s&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.muted}}>DATA: {result.source}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.accent}}>ENGINE: {engine.toUpperCase()}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.muted}}>RISK: {result.risk_pct}%</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.gold}}>RR: {result.rr}R · FIB: {fibLevel}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.accent}}>ENTRY: {entryMode.toUpperCase()}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.blue}}>SWING: {(minSwing*100).toFixed(1)}% · BUF: {(stopBuf*100).toFixed(1)}% · STALE: {kStale||"off"}</span>
          </div>
          <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em"}}>TOTAL RETURN</div>
              <div style={{fontSize:40,fontWeight:800,color:col,lineHeight:1}}>{green?"+":""}{fmt(s.total_return)}%</div>
            </div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:13,marginBottom:4}}>$100 → <strong style={{color:col}}>${fmt(s.final_equity)}</strong></div>
              <div style={{fontSize:11,color:C.muted}}>{s.total_trades} trades · {s.wins}W / {s.losses}L · {fmt(s.win_rate)}% WR</div>
              <div style={{fontSize:11,color:C.muted}}>CAGR {fmt(s.cagr)}% · Max DD -{fmt(s.max_drawdown)}% · Sharpe {fmt(s.sharpe)}</div>
            </div>
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 16px",marginBottom:16,display:"flex",gap:24,flexWrap:"wrap"}}>
            <div style={{fontSize:10,color:C.muted}}>
              <span style={{color:C.text,fontWeight:700,fontSize:14,marginRight:6}}>{s.total_trades}</span>Total Trades
            </div>
            <div style={{fontSize:10,color:C.muted}}>
              <span style={{color:C.accent,fontWeight:700,fontSize:14,marginRight:6}}>{s.wins}</span>Wins
            </div>
            <div style={{fontSize:10,color:C.muted}}>
              <span style={{color:C.red,fontWeight:700,fontSize:14,marginRight:6}}>{s.losses}</span>Losses
            </div>
            <div style={{fontSize:10,color:C.muted}}>
              <span style={{color:C.gold,fontWeight:700,fontSize:14,marginRight:6}}>{fmt(s.win_rate)}%</span>Win Rate
            </div>
            <div style={{fontSize:10,color:C.muted}}>
              <span style={{color:C.text,fontWeight:700,fontSize:14,marginRight:6}}>{fmt(s.profit_factor)}</span>Profit Factor
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
            <StatCard label="Final Equity"  value={`$${fmt(s.final_equity)}`}   color={col}/>
            <StatCard label="CAGR"          value={`${fmt(s.cagr)}%`}           color={C.gold} sub="annualised"/>
            <StatCard label="Daily Avg"     value={`${fmt(s.daily_return,3)}%`}/>
            <StatCard label="Win Rate"      value={`${fmt(s.win_rate)}%`}       sub={`${s.wins}W / ${s.losses}L`}/>
            <StatCard label="Profit Factor" value={fmt(s.profit_factor)}        color={s.profit_factor>=1.5?C.accent:C.red}/>
            <StatCard label="Max Drawdown"  value={`-${fmt(s.max_drawdown)}%`}  color={C.red}/>
            <StatCard label="Sharpe"        value={fmt(s.sharpe)}               color={s.sharpe>=1?C.accent:C.muted}/>
            <StatCard label="Max Consec W"  value={s.max_consec_wins}           color={C.accent}/>
            <StatCard label="Max Consec L"  value={s.max_consec_losses}         color={C.red}/>
            <StatCard label="Avg Win $"     value={`$${fmt(s.avg_win,3)}`}      color={C.accent}/>
            <StatCard label="Avg Loss $"    value={`$${fmt(s.avg_loss,3)}`}     color={C.red}/>
            <StatCard label="Kelly Full"    value={`${fmt(s.kelly_full*100,1)}%`} color={C.gold} sub="optimal risk"/>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
            <div style={{display:"flex",borderBottom:`1px solid ${C.border}`}}>
              {[["curve","Equity"],["dd","Drawdown"],["pnl","PnL"]].map(([id,label])=>(
                <button key={id} onClick={()=>setTab(id)} style={{
                  flex:1,padding:"10px 8px",background:tab===id?C.card:"transparent",
                  color:tab===id?C.accent:C.muted,border:"none",
                  borderBottom:tab===id?`2px solid ${C.accent}`:"2px solid transparent",
                  fontSize:10,cursor:"pointer",letterSpacing:"0.08em",textTransform:"uppercase"
                }}>{label}</button>
              ))}
            </div>
            <div style={{padding:"16px 8px"}}>
              {tab==="curve"&&(
                <ResponsiveContainer width="100%" height={200}>
                  <AreaChart data={result.equity_curve} margin={{top:4,right:4,left:0,bottom:0}}>
                    <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">

// ── MATRIX TAB ────────────────────────────────────────────
function MatrixTab(){
  const [selPairs,      setSelPairs]      = useState(["SOL/USDT","BTC/USDT","XRP/USDT"]);
  const [selTfs,        setSelTfs]        = useState(["1m"]);
  const [selRisks,      setSelRisks]      = useState(["fixed"]);
  const [selPivots,     setSelPivots]     = useState([3]);
  const [selRR,         setSelRR]         = useState([1.5,2]);
  const [selFibs,       setSelFibs]       = useState([0.618]);
  const [selEngines,    setSelEngines]    = useState(["classic","classic_v2","structure"]);
  const [selEntryModes, setSelEntryModes] = useState(["rejection"]);
  const [period,        setPeriod]        = useState(3);
  const [status,        setStatus]        = useState("idle");
  const [results,       setResults]       = useState([]);
  const [progress,      setProgress]      = useState(0);
  const [total,         setTotal]         = useState(0);
  const [sortKey,       setSortKey]       = useState("total_return");
  const [sortDir,       setSortDir]       = useState("desc");
  const [error,         setError]         = useState("");

  const ALL_ENGINES    = ["classic","classic_v2","structure"];
  const ALL_ENTRY      = ["touch","rejection","reclaim"];
  const tog=(arr,setArr,val)=>setArr(toggle(arr,val));
  const totalCombos=selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length*selFibs.length*selEngines.length*selEntryModes.length;

  const run=useCallback(async()=>{
    if(!totalCombos) return;
    setStatus("loading"); setResults([]); setProgress(0); setError("");
    const {start,end}=getPeriodDates(PERIODS[period]);
    const configs=[];
    for(const sym of selPairs) for(const tf of selTfs) for(const risk of selRisks)
      for(const pn of selPivots) for(const rr of selRR) for(const fib of selFibs)
        for(const eng of selEngines) for(const em of selEntryModes)
          configs.push({symbol:sym,timeframe:tf,start_date:start,end_date:end,
            pivot_n:pn,risk_method:risk,risk_pct:0.02,rr,fib_level:fib,
            engine:eng,entry_mode:em});
    setTotal(configs.length);
    const allResults=[];
    for(let i=0;i<configs.length;i+=8){
      const batch=configs.slice(i,i+8);
      try{
        const res=await fetch(`${API}/batch`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({configs:batch})});
        const data=await res.json();
        if(data.success){allResults.push(...data.results);setProgress(allResults.length);setResults([...allResults]);}
      }catch(e){setError(e.message);}
    }
    setStatus("done");
  },[selPairs,selTfs,selRisks,selPivots,selRR,selFibs,selEngines,selEntryModes,period,totalCombos]);

  const sorted=useMemo(()=>{
    const ok=results.filter(r=>r.success&&r.stats);
    return [...ok].sort((a,b)=>{
      const va=a.stats[sortKey]??0, vb=b.stats[sortKey]??0;
      return sortDir==="desc"?vb-va:va-vb;
    });
  },[results,sortKey,sortDir]);

  const handleSort=(k)=>{if(sortKey===k)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortKey(k);setSortDir("desc");}};
  const SortTh=({k,label})=>(
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 10px",color:sortKey===k?C.accent:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        {[
          ["Pairs",       ALL_PAIRS,      selPairs,      setSelPairs,      p=>p.replace("/USDT","")],
          ["Timeframes",  ALL_TIMEFRAMES, selTfs,        setSelTfs,        t=>t.toUpperCase()],
          ["Risk Methods",ALL_RISKS,      selRisks,      setSelRisks,      fmtRisk],
          ["Pivot N",     ALL_PIVOTS,     selPivots,     setSelPivots,     n=>`N=${n}`],
          ["Risk:Reward", ALL_RR,         selRR,         setSelRR,         r=>`${r}R`],
          ["Fib Level",   ALL_FIBS,       selFibs,       setSelFibs,       f=>`${f}`],
          ["Engine",      ALL_ENGINES,    selEngines,    setSelEngines,    e=>e],
          ["Entry Mode",  ALL_ENTRY,      selEntryModes, setSelEntryModes, e=>e],
        ].map(([label,all,sel,setSel,fmt])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmt(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)}/>)}
            </div>
          </div>
        ))}
        <div style={{marginBottom:14}}>
          <Sel label="Period" value={period} onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))}/>
        </div>
        <button onClick={run} disabled={status==="loading"||!totalCombos} style={{
          background:status==="loading"||!totalCombos?C.dim:C.accent,color:C.bg,border:"none",
          borderRadius:8,padding:"12px 20px",fontSize:13,fontWeight:800,
          cursor:status==="loading"||!totalCombos?"not-allowed":"pointer",letterSpacing:"0.08em",width:"100%"
        }}>{status==="loading"?`⟳ ${progress}/${total} running...`:`▶ RUN MATRIX (${totalCombos} combos)`}</button>
        {status==="loading"&&<ProgressBar value={progress} total={total}/>}
        {error&&<div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {error}</div>}
      </div>

      {sorted.length>0&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <span style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>{sorted.length} combinations</span>
            {sorted[0]&&<span style={{fontSize:10,color:C.accent}}>
              Best: {sorted[0].symbol.replace("/USDT","")} {sorted[0].timeframe?.toUpperCase()} N={sorted[0].pivot_n} {sorted[0].rr}R {sorted[0].fib_level} [{sorted[0].engine||"—"}] [{sorted[0].entry_mode||"—"}]
            </span>}
            <button onClick={()=>{
              const headers=["Pair","TF","Risk","N","RR","Fib","Engine","EntryMode","Return%","CAGR%","MaxDD%","Sharpe","PF","WR%","Trades","AvgWin","AvgLoss","MaxCWins","MaxCLoss","KellyFull","KellyHalf","FinalEquity"];
              const rows=sorted.map(r=>{const s=r.stats;return[
                r.symbol.replace("/USDT",""),r.timeframe,r.risk_method,r.pivot_n,r.rr,r.fib_level||0.618,
                r.engine||"—",r.entry_mode||"—",
                s.total_return,s.cagr,s.max_drawdown,s.sharpe,s.profit_factor,s.win_rate,s.total_trades,
                s.avg_win,s.avg_loss,s.max_consec_wins,s.max_consec_losses,s.kelly_full,s.kelly_half,s.final_equity

              const csv=[headers.join(","),...rows].join("\n");
              const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="waddle_matrix_results.csv";a.click();
            }} style={{marginLeft:"auto",padding:"4px 12px",background:"transparent",border:`1px solid ${C.accent}`,borderRadius:6,color:C.accent,fontSize:10,cursor:"pointer"}}>⬇ Export CSV</button>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:C.bg}}>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Pair</th>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>TF</th>

  const [selTfs,        setSelTfs]        = useState(["4h"]);

  const [selEngines,    setSelEngines]    = useState(["structure"]);
  const [selEntryModes, setSelEntryModes] = useState(["rejection"]);

  const ALL_ENGINES = ["classic","classic_v2","structure"];

  const [periodA,   setPeriodA]   = useState({label:"2025 Full", start:"2025-01-01", end:"2026-01-01"});
  const [periodB,   setPeriodB]   = useState({label:"2026 YTD",  start:"2026-01-01", end:"now"});
  const [status,    setStatus]    = useState("idle");
  const [results,   setResults]   = useState([]);
  const [sortKey,   setSortKey]   = useState("consistency_score");
  const [sortDir,   setSortDir]   = useState("desc");
  const [filter,    setFilter]    = useState("all");
  const [error,     setError]     = useState("");

  const tog=(arr,setArr,val)=>setArr(toggle(arr,val));
  const totalCombos=selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length*selFibs.length*selEngines.length*selEntryModes.length;

  const PERIOD_PRESETS=[
    {label:"Last 7 Days",  start:null, end:"now", days:7},
    {label:"Last 30 Days", start:null, end:"now", days:30},
    {label:"Last 90 Days", start:null, end:"now", days:90},
    {label:"2025 Full",    start:"2025-01-01", end:"2026-01-01"},
    {label:"2026 YTD",     start:"2026-01-01", end:"now"},
  ];

  const run=useCallback(async()=>{
    if(!totalCombos) return;
    setStatus("loading"); setResults([]); setError("");
    const getStart = (p) => {
      if(p.start) return p.start;
      const d=new Date(Date.now()-p.days*86400000);
      return d.toISOString().split("T")[0];
    };
    try{
      const res=await fetch(`${API}/compare`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          symbols:selPairs,timeframes:selTfs,pivot_ns:selPivots,
          risk_methods:selRisks,rr_ratios:selRR,fib_levels:selFibs,
          engines:selEngines,entry_modes:selEntryModes,
          period_a_start:getStart(periodA),period_a_end:periodA.end,
          period_b_start:getStart(periodB),period_b_end:periodB.end,
        })
      });
      const data=await res.json();
      if(!data.success) throw new Error(data.error||"Compare failed");
      setResults(data.results);
      setStatus("done");
    }catch(e){setError(e.message);setStatus("error");}
  },[selPairs,selTfs,selRisks,selPivots,selRR,periodA,periodB,totalCombos]);

    let r=[...results];
    if(filter==="both_positive") r=r.filter(x=>x.both_positive);
    if(filter==="top20") r=r.slice(0,20);
    return [...r].sort((a,b)=>{
      const va=a[sortKey]??0, vb=b[sortKey]??0;
      return sortDir==="desc"?vb-va:va-vb;
    });
  },[results,filter,sortKey,sortDir]);

  const handleSort=(k)=>{if(sortKey===k)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortKey(k);setSortDir("desc");}};
  const SortTh=({k,label})=>(
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 8px",color:sortKey===k?C.accent:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Period A vs Period B</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:9,color:C.accent,marginBottom:6}}>PERIOD A</div>
              {PERIOD_PRESETS.map(p=>(
                <div key={p.label} onClick={()=>setPeriodA(p)} style={{
                  background:periodA.label===p.label?C.accentDim:C.card,
                  border:`1px solid ${periodA.label===p.label?C.accent:C.border}`,
                  borderRadius:6,padding:"7px 10px",cursor:"pointer",
                  fontSize:11,color:periodA.label===p.label?C.accent:C.muted,marginBottom:4
                }}>{p.label}</div>
              ))}
            </div>
            <div>
              <div style={{fontSize:9,color:C.gold,marginBottom:6}}>PERIOD B</div>
              {PERIOD_PRESETS.map(p=>(
                <div key={p.label} onClick={()=>setPeriodB(p)} style={{
                  background:periodB.label===p.label?C.goldDim:C.card,
                  border:`1px solid ${periodB.label===p.label?C.gold:C.border}`,
                  borderRadius:6,padding:"7px 10px",cursor:"pointer",

        {[

          ["Risk Methods",ALL_RISKS,      selRisks,      setSelRisks,      fmtRisk],
          ["Pivot N",     ALL_PIVOTS,     selPivots,     setSelPivots,     n=>`N=${n}`],
          ["Risk:Reward", ALL_RR,         selRR,         setSelRR,         r=>`${r}R`],
          ["Fib Level",   ALL_FIBS,       selFibs,       setSelFibs,       f=>`${f}`],
          ["Engine",      ALL_ENGINES,    selEngines,    setSelEngines,    e=>e],
          ["Entry Mode",  ALL_ENTRY,      selEntryModes, setSelEntryModes, e=>e],
        ].map(([label,all,sel,setSel,fmt])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmt(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)}/>)}
            </div>
          </div>
        ))}

        <button onClick={run} disabled={status==="loading"||!totalCombos} style={{
          background:status==="loading"||!totalCombos?C.dim:C.gold,
          color:C.bg,border:"none",borderRadius:8,padding:"12px 20px",
          fontSize:13,fontWeight:800,cursor:status==="loading"||!totalCombos?"not-allowed":"pointer",
          letterSpacing:"0.08em",width:"100%"
        }}>{status==="loading"?"⟳ COMPARING...`":`⚖ COMPARE ${totalCombos} COMBOS × 2 PERIODS`}</button>
        {error&&<div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {error}</div>}
      </div>

      {results.length>0&&(
        <div>
          {filtered[0]&&(
            <div style={{background:C.goldDim,border:`1px solid ${C.gold}`,borderRadius:12,padding:"14px 18px",marginBottom:16}}>
              <div style={{fontSize:10,color:C.gold,letterSpacing:"0.1em",marginBottom:6}}>⭐ MOST CONSISTENT</div>
              <div style={{fontSize:18,fontWeight:800,color:C.text}}>
                {filtered[0].symbol.replace("/USDT","")} {filtered[0].timeframe?.toUpperCase()} · {fmtRisk(filtered[0].risk)} · N={filtered[0].pivot_n} · {filtered[0].rr}R
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:4}}>
                {periodA.label}: <span style={{color:filtered[0].period_a_return>=0?C.accent:C.red,fontWeight:700}}>{filtered[0].period_a_return>=0?"+":""}{fmt(filtered[0].period_a_return)}%</span>
                {" · "}
                {periodB.label}: <span style={{color:filtered[0].period_b_return>=0?C.gold:C.red,fontWeight:700}}>{filtered[0].period_b_return>=0?"+":""}{fmt(filtered[0].period_b_return)}%</span>
                {" · "}Score: <span style={{color:C.gold,fontWeight:700}}>{fmt(filtered[0].consistency_score)}</span>
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            {[["all","All"],["both_positive","Both Positive"],["top20","Top 20"]].map(([v,l])=>(
              <div key={v} onClick={()=>setFilter(v)} style={{
                background:filter===v?C.accentDim:C.card,
                border:`1px solid ${filter===v?C.accent:C.border}`,
                borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:10,
                color:filter===v?C.accent:C.muted
              }}>{l}</div>
            ))}
            <div style={{marginLeft:"auto",fontSize:10,color:C.muted,alignSelf:"center"}}>{filtered.length} results</div>
            <button onClick={()=>{
              const headers=["Pair","TF","Risk","N","RR","Fib","Engine","EntryMode","Return%A","Return%B","AvgRet","AvgDD","Sharpe","Score"];
              const rows=sorted.map(r=>[r.symbol.replace("/USDT",""),r.timeframe,r.risk_method||r.risk,r.pivot_n,r.rr,r.fib_level||0.618,r.engine||"—",r.entry_mode||"—",r.period_a_return,r.period_b_return,r.avg_return,r.avg_dd,r.avg_sharpe,r.consistency_score].join(","));
              const csv=[headers.join(","),...rows].join("\n");
              const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="waddle_matrix_results.csv";a.click();
            }} style={{marginLeft:8,padding:"4px 10px",background:"transparent",border:`1px solid ${C.accent}`,borderRadius:6,color:C.accent,fontSize:10,cursor:"pointer"}}>⬇ Export CSV</button>
          </div>

          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Pair</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>TF</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Risk</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>N</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>RR</th>
                  <th style={{padding:"8px 8px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Engine</th>
                  <th style={{padding:"8px 8px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Entry</th>
                  <SortTh k="period_a_return" label={`${periodA.label} %`}/>
                  <SortTh k="period_b_return" label={`${periodB.label} %`}/>
                  <SortTh k="avg_return"      label="Avg Ret"/>
                  <SortTh k="avg_dd"          label="Avg DD"/>
                  <SortTh k="avg_sharpe"      label="Sharpe"/>
                  <SortTh k="consistency_score" label="Score ⭐"/>
                </tr></thead>
                <tbody>
                  {filtered.map((r,i)=>{
                    const isTop=i===0, bothPos=r.both_positive;
                    const rowBg=isTop?C.goldDim:bothPos?"#00ff9d08":"transparent";
                    return (
                      <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:rowBg}}>
                        <td style={{padding:"6px 8px",fontWeight:isTop?700:400,color:isTop?C.gold:C.text}}>{r.symbol.replace("/USDT","")}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{r.timeframe?.toUpperCase()}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{fmtRisk(r.risk||r.risk_method)}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{r.pivot_n}</td>
                        <td style={{padding:"6px 8px",color:C.gold}}>{r.rr}R</td>
                        <td style={{padding:"6px 8px"}}>
                          <span style={{background:C.accentDim,color:C.accent,padding:"2px 5px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.engine||"—"}</span>
                        </td>
                        <td style={{padding:"6px 8px"}}>
                          <span style={{background:C.blueDim,color:C.blue,padding:"2px 5px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.entry_mode||"—"}</span>
                        </td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_a_return>=0?C.accent:C.red,fontWeight:700}}>{r.period_a_return>=0?"+":""}{fmt(r.period_a_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_b_return>=0?C.gold:C.red,fontWeight:700}}>{r.period_b_return>=0?"+":""}{fmt(r.period_b_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_return>=0?C.accent:C.red}}>{r.avg_return>=0?"+":""}{fmt(r.avg_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.red}}>-{fmt(r.avg_dd)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_sharpe>=1?C.accent:C.muted}}>{fmt(r.avg_sharpe)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.gold,fontWeight:isTop?700:400}}>{fmt(r.consistency_score)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
      {status==="idle"&&<div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>Select periods and variables, then hit <span style={{color:C.gold}}>⚖ COMPARE</span></div>}
    </div>
  );
}


// ── JOURNAL TAB ───────────────────────────────────────────
function JournalTab(){
  const [account,  setAccount]  = useState(null);
  const [trades,   setTrades]   = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [error,    setError]    = useState("");
  const [filterPair,   setFilterPair]   = useState("all");
  const [filterTF,     setFilterTF]     = useState("all");
  const [filterLabel,  setFilterLabel]  = useState("all");
  const [filterResult, setFilterResult] = useState("all");
  const [tab,      setTab]      = useState("overview");

  const load = useCallback(async()=>{
    setLoading(true); setError("");
    try{
      const res = await fetch(`${API}/journal`);
      const data = await res.json();
      if(data.success){
        setAccount(data.account||null);
        setTrades(Array.isArray(data.trades)?data.trades:[]);
      } else throw new Error(data.error||"Failed");
    }catch(e){ setError(e.message); }
    setLoading(false);
  },[]);

  useEffect(()=>{ load(); },[]);

  const pairs  = useMemo(()=>["all",...new Set(trades.map(t=>t.symbol))],[trades]);
  const tfs    = useMemo(()=>["all",...new Set(trades.map(t=>t.timeframe))],[trades]);
  const labels = useMemo(()=>["all",...new Set(trades.map(t=>t.label).filter(Boolean))],[trades]);

  const filtered = useMemo(()=>trades.filter(t=>{
    if(filterPair!=="all"&&t.symbol!==filterPair) return false;
    if(filterTF!=="all"&&t.timeframe!==filterTF) return false;
    if(filterLabel!=="all"&&t.label!==filterLabel) return false;
    if(filterResult==="win"&&!t.won) return false;
    if(filterResult==="loss"&&t.won) return false;
    return true;
  }),[trades,filterPair,filterTF,filterLabel,filterResult]);

  const stats = useMemo(()=>{
    if(!filtered.length) return null;
    const wins=filtered.filter(t=>t.won), losses=filtered.filter(t=>!t.won);
    const totalPnl=filtered.reduce((a,t)=>a+(t.pnl||0),0);
    const wr=wins.length/filtered.length*100;
    const avgWin=wins.length?wins.reduce((a,t)=>a+(t.pnl||0),0)/wins.length:0;
    const avgLoss=losses.length?Math.abs(losses.reduce((a,t)=>a+(t.pnl||0),0)/losses.length):0;
    const pf=avgLoss>0?avgWin/avgLoss:999;
    let maxCW=0,maxCL=0,cw=0,cl=0;
    [...filtered].reverse().forEach(t=>{if(t.won){cw++;cl=0;maxCW=Math.max(maxCW,cw);}else{cl++;cw=0;maxCL=Math.max(maxCL,cl);}});
    return{wins:wins.length,losses:losses.length,total:filtered.length,totalPnl,wr,avgWin,avgLoss,pf,maxCW,maxCL};
  },[filtered]);

  const equityCurve = useMemo(()=>{
    let eq=100;
    return [...filtered].reverse().map(t=>{eq+=t.pnl||0;return{t:t.created_at,eq:Math.round(eq*100)/100};});
  },[filtered]);

  const pnlByPair = useMemo(()=>{
    const map={};
    filtered.forEach(t=>{if(!map[t.symbol])map[t.symbol]=0;map[t.symbol]+=(t.pnl||0);});
    return Object.entries(map).map(([name,value])=>({name:name.replace("/USDT",""),value:Math.round(value*100)/100}));
  },[filtered]);

  const fmtDate = (s)=>s?new Date(s).toLocaleDateString("en-MY",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
  const acc = account;
  const totalReturn = acc?Math.round(((acc.balance-100)/100*100)*100)/100:0;
  const green = totalReturn>=0;
  const col = green?C.accent:C.red;
  const sel2 = {background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,cursor:"pointer",outline:"none"};

  if(loading) return <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>⟳ Loading journal...</div>;
  if(error) return <div style={{color:C.red,fontSize:12,padding:"20px",background:C.redDim,border:`1px solid ${C.red}`,borderRadius:8}}>✗ {error}</div>;

  return (
    <div>
      {/* Account Banner */}
      {acc?(
        <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em"}}>ACCOUNT BALANCE</div>
            <div style={{fontSize:34,fontWeight:800,color:col,lineHeight:1}}>${fmt(acc.balance)}</div>
          </div>
          <div style={{flex:1,minWidth:180}}>
            <div style={{fontSize:13,marginBottom:4}}>Total Return: <strong style={{color:col}}>{green?"+":""}{fmt(totalReturn)}%</strong></div>
            <div style={{fontSize:11,color:C.muted}}>{acc.total_trades} trades · {acc.wins}W / {acc.losses}L · Max DD -{fmt(acc.max_drawdown)}%</div>
          </div>
          <button onClick={load} style={{background:C.card,color:C.accent,border:`1px solid ${C.accent}`,borderRadius:8,padding:"8px 14px",fontSize:10,cursor:"pointer"}}>↻ Refresh</button>
        </div>
      ):(
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>
          No paper trades yet — waiting for first signal 🤖
        </div>
      )}

      {/* Filters */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>Filter Trades</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            ["Pair", filterPair, setFilterPair, pairs, p=>p==="all"?"All Pairs":p],
            ["Timeframe", filterTF, setFilterTF, tfs, t=>t==="all"?"All TF":t.toUpperCase()],
            ["Strategy", filterLabel, setFilterLabel, labels, l=>l==="all"?"All":l],
            ["Result", filterResult, setFilterResult, ["all","win","loss"], r=>r==="all"?"All Results":r==="win"?"Wins Only":"Losses Only"],
          ].map(([label,val,setVal,opts,fmtOpt])=>(
            <div key={label} style={{display:"flex",flexDirection:"column",gap:3}}>
              <span style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{label}</span>
              <select value={val} onChange={e=>setVal(e.target.value)} style={sel2}>
                {opts.map(o=><option key={o} value={o}>{fmtOpt(o)}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:0,marginBottom:16,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {[["overview","Overview"],["chart","Equity"],["breakdown","By Pair"],["trades","Trade Log"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            flex:1,padding:"10px 4px",background:tab===id?C.card:"transparent",
            color:tab===id?C.accent:C.muted,border:"none",
            borderBottom:tab===id?`2px solid ${C.accent}`:"2px solid transparent",
            fontSize:9,cursor:"pointer",letterSpacing:"0.06em",textTransform:"uppercase"
          }}>{label}</button>
        ))}
      </div>

      {/* Overview */}
      {tab==="overview"&&(
        <div>
          {!stats?(
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
              <StatCard label="Total Trades"  value={stats.total}                           />
              <StatCard label="Win Rate"      value={`${fmt(stats.wr)}%`}   color={stats.wr>=50?C.accent:C.red} sub={`${stats.wins}W / ${stats.losses}L`}/>
              <StatCard label="Total P&L"     value={`${stats.totalPnl>=0?"+":""}$${fmt(stats.totalPnl)}`} color={stats.totalPnl>=0?C.accent:C.red}/>
              <StatCard label="Profit Factor" value={fmt(stats.pf)}          color={stats.pf>=1.5?C.accent:C.red}/>
              <StatCard label="Avg Win $"     value={`$${fmt(stats.avgWin)}`} color={C.accent}/>
              <StatCard label="Avg Loss $"    value={`$${fmt(stats.avgLoss)}`} color={C.red}/>
              <StatCard label="Max Consec W"  value={stats.maxCW}             color={C.accent}/>
              <StatCard label="Max Consec L"  value={stats.maxCL}             color={C.red}/>
            </div>
          )}
        </div>
      )}

      {/* Equity Curve */}
      {tab==="chart"&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Equity Curve · $100 Start</div>
          {equityCurve.length>1?(
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={equityCurve} margin={{top:4,right:4,left:0,bottom:0}}>
                <defs><linearGradient id="jgrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={C.accent} stopOpacity={0.3}/>
                  <stop offset="95%" stopColor={C.accent} stopOpacity={0}/>
                </linearGradient></defs>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                <XAxis dataKey="t" tickFormatter={t=>new Date(t).toLocaleDateString("en-MY",{month:"short",day:"numeric"})} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={44}/>
                <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                <ReferenceLine y={100} stroke={C.muted} strokeDasharray="4 4"/>
                <Area type="monotone" dataKey="eq" stroke={C.accent} strokeWidth={2} fill="url(#jgrad)" dot={false}/>
              </AreaChart>
            </ResponsiveContainer>
          ):(
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>Not enough trades yet</div>
          )}
        </div>
      )}

      {/* By Pair */}
      {tab==="breakdown"&&(
        <div>
          {pnlByPair.length>0&&(
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>P&L by Pair</div>
              <ResponsiveContainer width="100%" height={180}>
                <BarChart data={pnlByPair} margin={{top:4,right:4,left:0,bottom:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                  <XAxis dataKey="name" tick={{fill:C.muted,fontSize:10}} tickLine={false} axisLine={false}/>
                  <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} width={44}/>
                  <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                  <ReferenceLine y={0} stroke={C.muted}/>
                  <Bar dataKey="value" radius={[3,3,0,0]} fill={C.accent}/>
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}
          {filtered.length>0&&(
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
              <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>Stats by Pair + Strategy</div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead><tr style={{background:C.bg}}>
                    {["Pair","TF","Strategy","Trades","WR %","P&L","Avg Win","Avg Loss"].map(h=>(
                      <th key={h} style={{padding:"7px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {(()=>{
                      const groups={};
                      filtered.forEach(t=>{const k=`${t.symbol}|${t.timeframe}|${t.label||"-"}`;if(!groups[k])groups[k]=[];groups[k].push(t);});
                      return Object.entries(groups).map(([k,ts])=>{
                        const[sym,tf,lbl]=k.split("|");
                        const w=ts.filter(t=>t.won),l=ts.filter(t=>!t.won);
                        const pnl=ts.reduce((a,t)=>a+(t.pnl||0),0);
                        const aw=w.length?w.reduce((a,t)=>a+(t.pnl||0),0)/w.length:0;
                        const al=l.length?Math.abs(l.reduce((a,t)=>a+(t.pnl||0),0)/l.length):0;
                        const wr=w.length/ts.length*100;
                        return(<tr key={k} style={{borderTop:`1px solid ${C.border}`}}>
                          <td style={{padding:"6px 10px",fontWeight:700}}>{sym.replace("/USDT","")}</td>
                          <td style={{padding:"6px 10px",color:C.muted}}>{tf.toUpperCase()}</td>
                          <td style={{padding:"6px 10px",color:C.gold,fontSize:9}}>{lbl}</td>
                          <td style={{padding:"6px 10px"}}>{ts.length} ({w.length}W/{l.length}L)</td>
                          <td style={{padding:"6px 10px",color:wr>=50?C.accent:C.red}}>{fmt(wr)}%</td>
                          <td style={{padding:"6px 10px",color:pnl>=0?C.accent:C.red}}>{pnl>=0?"+":""}${fmt(pnl)}</td>
                          <td style={{padding:"6px 10px",color:C.accent}}>${fmt(aw)}</td>
                          <td style={{padding:"6px 10px",color:C.red}}>${fmt(al)}</td>
                        </tr>);
                      });
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Trade Log */}
      {tab==="trades"&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>
            Trade Log · {filtered.length} trades
          </div>
          {filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>
          ):(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  {["Date","Pair","TF","Dir","Entry","Exit","RR","P&L","Balance","Strategy"].map(h=>(
                    <th key={h} style={{padding:"7px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {filtered.map((t,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:t.won?"#00ff9d05":"#ff446605"}}>
                      <td style={{padding:"6px 10px",color:C.muted,whiteSpace:"nowrap"}}>{fmtDate(t.created_at)}</td>
                      <td style={{padding:"6px 10px",fontWeight:700}}>{(t.symbol||"").replace("/USDT","")}</td>
                      <td style={{padding:"6px 10px",color:C.muted}}>{(t.timeframe||"").toUpperCase()}</td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{background:t.direction==="LONG"?C.accentDim:C.redDim,color:t.direction==="LONG"?C.accent:C.red,padding:"2px 6px",borderRadius:3,fontSize:9,fontWeight:700}}>{t.direction}</span>
                      </td>
                      <td style={{padding:"6px 10px"}}>{fmt(t.entry,4)}</td>
                      <td style={{padding:"6px 10px"}}>{fmt(t.exit_price,4)}</td>
                      <td style={{padding:"6px 10px",color:C.gold}}>{t.rr}R</td>
                      <td style={{padding:"6px 10px",color:t.pnl>=0?C.accent:C.red,fontWeight:700}}>{t.pnl>=0?"+":""}${fmt(t.pnl)}</td>
                      <td style={{padding:"6px 10px"}}>${fmt(t.balance)}</td>
                      <td style={{padding:"6px 10px",color:C.gold,fontSize:9}}>{t.label||"-"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────
function PrefetchPanel() {
  const [sym, setSym]       = useState("ETH/USDT");
  const [tf, setTf]         = useState("1m");
  const [status, setStatus] = useState("idle");
  const [msg, setMsg]       = useState("");
  const pairs = ["BTC/USDT","ETH/USDT","SOL/USDT","BNB/USDT","XRP/USDT","INJ/USDT"];
  const tfs   = ["1m","5m","15m","1h","4h","1d"];

  const prefetch = async () => {
    setStatus("loading"); setMsg("Starting...");
    // For 1m use last 30 days — a full year is 525k candles, too large
    const isShort = tf === "1m" || tf === "5m";
    const d = new Date(); d.setDate(d.getDate() - (isShort ? 30 : 365));
    const start = d.toISOString().split("T")[0];
    const end   = "now";
    const label = isShort ? "Last 30 Days" : "2025 Full Year";
    try {
      const res = await fetch(`${API}/prefetch`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({symbol:sym,timeframe:tf,start_date:start,end_date:end})
      });
      const data = await res.json();
      setMsg(`${label} — ${data.message||"Queued"}`);
      setStatus("queued");
      let polls=0;
      const poll = setInterval(async()=>{
        polls++;
        if(polls>120){clearInterval(poll);setStatus("timeout");setMsg("Timed out — check Railway logs");return;}
        try{
          const sr=await fetch(`${API}/prefetch-status?symbol=${encodeURIComponent(sym)}&timeframe=${tf}&start_date=${start}&end_date=${end}`);
          const sd=await sr.json();
          setMsg(`${sd.job_status} — ${(sd.db_candles||0).toLocaleString()} / ${(sd.expected||0).toLocaleString()} candles (${sd.completeness_pct||0}%)`);
          if(sd.job_status==="done"){clearInterval(poll);setStatus("done");}
          if(sd.job_status==="error"){clearInterval(poll);setStatus("error");setMsg(sd.error||"Error");}
        }catch(e){}
      },5000);
    }catch(e){setStatus("error");setMsg(e.message);}
  };

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:16}}>
      <div style={{fontSize:9,color:C.muted,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:10}}>📡 Prefetch Candle Data · 1M/5M = Last 30 Days · Others = 2025 Full Year</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <select value={sym} onChange={e=>setSym(e.target.value)} style={{background:C.surface,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"6px 10px",fontSize:11}}>
          {pairs.map(p=><option key={p} value={p}>{p.replace("/USDT","")}</option>)}
        </select>
        <select value={tf} onChange={e=>setTf(e.target.value)} style={{background:C.surface,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"6px 10px",fontSize:11}}>
          {tfs.map(t=><option key={t} value={t}>{t.toUpperCase()}</option>)}
        </select>
        <button onClick={prefetch} disabled={status==="loading"||status==="queued"} style={{
          padding:"6px 16px",
          background:status==="done"?C.accentDim:C.accent,
          color:C.bg,border:"none",borderRadius:6,fontSize:11,cursor:"pointer",fontWeight:700
        }}>{status==="loading"||status==="queued"?"⟳ Fetching...":status==="done"?"✅ Done":"⬇ Prefetch"}</button>
        {msg&&<span style={{fontSize:10,color:status==="error"?C.red:status==="done"?C.accent:C.muted}}>{msg}</span>}
      </div>
    </div>
  );
}

function PrefetchTab() {
  const [jobs, setJobs]       = useState([]);  // [{sym, tf, start, end, label, status, msg, pct}]
  const [sym, setSym]         = useState("SOL/USDT");
  const [tf, setTf]           = useState("1m");
  const [customStart, setCustomStart] = useState("2025-01-01");
  const [customEnd, setCustomEnd]     = useState("now");
  const [useCustom, setUseCustom]     = useState(false);

  const PAIRS = ["BTC/USDT","ETH/USDT","SOL/USDT","BNB/USDT","XRP/USDT","INJ/USDT"];
  const TFS   = ["1m","5m","15m","1h","4h","1d"];

  const getDateRange = (timeframe) => {
    if (useCustom) return { start: customStart, end: customEnd, label: `${customStart} → ${customEnd}` };
    const isShort = timeframe === "1m" || timeframe === "5m";
    const d = new Date(); d.setDate(d.getDate() - (isShort ? 30 : 365));
    return {
      start: d.toISOString().split("T")[0],
      end:   "now",
      label: isShort ? "Last 30 Days" : "Last 365 Days"
    };
  };

  const startPrefetch = async (pSym, pTf) => {
    const { start, end, label } = getDateRange(pTf);
    const key = `${pSym}_${pTf}`;

    // Add or update job
    setJobs(prev => {
      const existing = prev.find(j => j.key === key);
      if (existing) return prev.map(j => j.key === key ? {...j, status:"loading", msg:"Starting...", pct:0} : j);
      return [...prev, { key, sym: pSym, tf: pTf, start, end, label, status:"loading", msg:"Starting...", pct:0 }];
    });

    try {
      await fetch(`${API}/prefetch`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ symbol: pSym, timeframe: pTf, start_date: start, end_date: end })
      });

      // Poll status
      let polls = 0;
      const poll = setInterval(async () => {
        polls++;
        if (polls > 180) {
          clearInterval(poll);
          setJobs(prev => prev.map(j => j.key===key ? {...j, status:"timeout", msg:"Timed out"} : j));
          return;
        }
        try {
          const sr = await fetch(`${API}/prefetch-status?symbol=${encodeURIComponent(pSym)}&timeframe=${pTf}&start_date=${start}&end_date=${end}`);
          const sd = await sr.json();
          const pct = sd.completeness_pct || 0;
          const msg = `${(sd.db_candles||0).toLocaleString()} / ${(sd.expected||0).toLocaleString()} candles (${pct}%)`;
          const done = sd.job_status === "done" || pct >= 75;
          const err  = sd.job_status === "error";
          if (done || err) clearInterval(poll);
          setJobs(prev => prev.map(j => j.key===key ? {
            ...j,
            status: err ? "error" : done ? "done" : "loading",
            msg, pct,
            db_candles: sd.db_candles,
            expected: sd.expected
          } : j));
        } catch(e) {}
      }, 5000);
    } catch(e) {
      setJobs(prev => prev.map(j => j.key===key ? {...j, status:"error", msg:e.message} : j));
    }
  };

  const clearDone = () => setJobs(prev => prev.filter(j => j.status !== "done"));

  // Batch: prefetch all pairs for selected TF
  const batchAll = () => PAIRS.forEach(p => startPrefetch(p, tf));

  const statusColor = (s) => s==="done"?C.accent : s==="error"?C.red : s==="timeout"?C.gold : C.muted;
  const statusIcon  = (s) => s==="done"?"✅" : s==="error"?"✗" : s==="timeout"?"⏱" : "⟳";

  return (
    <div>
      {/* Controls */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:12}}>
          📡 Prefetch Candle Data
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          <Sel label="Pair"      value={sym} onChange={setSym} options={PAIRS.map(p=>({value:p,label:p}))}/>
          <Sel label="Timeframe" value={tf}  onChange={setTf}  options={TFS.map(t=>({value:t,label:t.toUpperCase()}))}/>
        </div>

        {/* Date range toggle */}
        <div style={{marginBottom:12}}>
          <div style={{fontSize:9,color:C.muted,letterSpacing:"0.1em",marginBottom:6}}>DATE RANGE</div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            {[false,true].map(v=>(
              <div key={String(v)} onClick={()=>setUseCustom(v)} style={{
                background:useCustom===v?C.accentDim:C.card,
                border:`1px solid ${useCustom===v?C.accent:C.border}`,
                borderRadius:6,padding:"6px 14px",cursor:"pointer",fontSize:11,
                color:useCustom===v?C.accent:C.text
              }}>{v?"Custom":"Auto"}</div>
            ))}
          </div>
          {useCustom ? (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:9,color:C.muted,marginBottom:4}}>START</div>
                <input type="date" value={customStart} onChange={e=>setCustomStart(e.target.value)}
                  style={{background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,width:"100%"}}/>
              </div>
              <div>
                <div style={{fontSize:9,color:C.muted,marginBottom:4}}>END (leave blank = now)</div>
                <input type="date" value={customEnd==="now"?"":customEnd}
                  onChange={e=>setCustomEnd(e.target.value||"now")}
                  style={{background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,width:"100%"}}/>
              </div>
            </div>
          ) : (
            <div style={{fontSize:10,color:C.muted}}>
              1m/5m → Last 30 days &nbsp;·&nbsp; 15m and above → Last 365 days
            </div>
          )}
        </div>

        {/* Buttons */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <button onClick={()=>startPrefetch(sym,tf)} style={{
            background:C.accent,color:C.bg,border:"none",borderRadius:8,
            padding:"11px 0",fontSize:12,fontWeight:800,cursor:"pointer"
          }}>⬇ Prefetch {sym.replace("/USDT","")} {tf.toUpperCase()}</button>
          <button onClick={batchAll} style={{
            background:C.goldDim,color:C.gold,border:`1px solid ${C.gold}`,borderRadius:8,
            padding:"11px 0",fontSize:12,fontWeight:800,cursor:"pointer"
          }}>⬇ All Pairs · {tf.toUpperCase()}</button>
        </div>
      </div>

      {/* Job list */}
      {jobs.length > 0 && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>
              Jobs · {jobs.length} total · {jobs.filter(j=>j.status==="done").length} done
            </span>
            <button onClick={clearDone} style={{
              background:"transparent",color:C.muted,border:`1px solid ${C.border}`,
              borderRadius:4,padding:"3px 10px",fontSize:9,cursor:"pointer"
            }}>Clear Done</button>
          </div>
          <div>
            {[...jobs].reverse().map(j=>(
              <div key={j.key} style={{
                padding:"12px 16px",borderBottom:`1px solid ${C.border}`,
                background:j.status==="done"?C.accentDim:j.status==="error"?C.redDim:"transparent"
              }}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <span style={{fontSize:13,fontWeight:800}}>{j.sym.replace("/USDT","")}</span>
                    <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"2px 7px",fontSize:10,color:C.gold}}>{j.tf.toUpperCase()}</span>
                    <span style={{fontSize:10,color:C.muted}}>{j.label}</span>
                  </div>
                  <span style={{fontSize:11,color:statusColor(j.status),fontWeight:700}}>
                    {statusIcon(j.status)} {j.status.toUpperCase()}
                  </span>
                </div>
                {/* Progress bar */}
                <div style={{background:C.dim,borderRadius:3,height:4,marginBottom:4}}>
                  <div style={{
                    background:j.status==="done"?C.accent:j.status==="error"?C.red:C.gold,
                    borderRadius:3,height:4,
                    width:`${Math.min(j.pct||0,100)}%`,
                    transition:"width 0.5s ease"
                  }}/>
                </div>
                <div style={{fontSize:10,color:C.muted}}>{j.msg}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {jobs.length === 0 && (
        <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>
          Select pair + timeframe and hit <span style={{color:C.accent}}>⬇ Prefetch</span>
        </div>
      )}
    </div>
  );
}
