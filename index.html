<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waddle Fib Engine v2.0</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  ::-webkit-scrollbar { height:4px; width:4px; }
  ::-webkit-scrollbar-thumb { background:#1c2433; border-radius:2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const API = "https://web-production-85d80.up.railway.app";

const C = {
  bg:"#07090f", surface:"#0d1117", card:"#111820", border:"#1c2433",
  accent:"#00ff9d", accentDim:"#00ff9d15", red:"#ff4466", redDim:"#ff446615",
  gold:"#ffd666", goldDim:"#ffd66615", blue:"#3b8bff", blueDim:"#3b8bff15",
  text:"#e6edf3", muted:"#6e7681", dim:"#21262d",
};

function StatCard({label,value,sub,color}) {
  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:12,flex:1,minWidth:90}}>
      <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{label}</div>
      <div style={{fontSize:18,fontWeight:700,color:color||C.text}}>{value}</div>
      {sub && <div style={{fontSize:9,color:C.muted,marginTop:2}}>{sub}</div>}
    </div>
  );
}

function Btn({onClick,disabled,children,color,filled}) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background:filled?(color||C.accent):"transparent",
      color:filled?C.bg:(color||C.accent),
      border:`1px solid ${color||C.accent}`,
      borderRadius:8, padding:"10px 16px", fontSize:11, fontWeight:700,
      letterSpacing:"0.05em", textTransform:"uppercase",
      cursor:disabled?"not-allowed":"pointer", opacity:disabled?0.5:1,
    }}>{children}</button>
  );
}

// ── RUNNER TAB ───────────────────────────────────────────────
function RunnerTab() {
  const [engine, setEngine] = React.useState("bos");
  const [stage,  setStage]  = React.useState("sweep");
  const [status, setStatus] = React.useState(null);
  const [msg,    setMsg]    = React.useState("");
  const [busy,   setBusy]   = React.useState(false);

  const fetchStatus = async () => {
    try {
      const res = await fetch(`${API}/matrix-status`);
      setStatus(await res.json());
    } catch(e) {}
  };

  React.useEffect(() => { fetchStatus(); const iv=setInterval(fetchStatus,8000); return ()=>clearInterval(iv); }, []);

  const trigger = async () => {
    setBusy(true); setMsg("");
    try {
      const res = await fetch(`${API}/run-matrix?engine=${engine}&stage=${stage}`);
      const data = await res.json();
      setMsg(data.message || (data.success ? "Started" : "Failed"));
      fetchStatus();
    } catch(e) { setMsg("Error: "+e.message); }
    setBusy(false);
  };

  const prefetch = async () => {
    setBusy(true); setMsg("");
    try {
      const res = await fetch(`${API}/prefetch-candles`, {method:"POST"});
      const data = await res.json();
      setMsg(data.message || "Prefetch started");
      fetchStatus();
    } catch(e) { setMsg("Error: "+e.message); }
    setBusy(false);
  };

  const isRunning = status?.is_running;
  const pct = status?.total > 0 ? Math.round((status.completed||0)/status.total*100) : 0;

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${isRunning?C.gold:C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:isRunning?C.gold:C.muted,boxShadow:isRunning?`0 0 8px ${C.gold}`:"none"}}/>
          <span style={{fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:700,color:isRunning?C.gold:C.muted}}>
            {isRunning ? "Running" : "Idle"}
          </span>
        </div>
        {status?.phase && <div style={{fontSize:11,color:C.text,marginBottom:8}}>{status.phase}</div>}
        {status?.total > 0 && (
          <div style={{background:C.dim,borderRadius:6,height:6,overflow:"hidden",marginBottom:6}}>
            <div style={{width:`${pct}%`,height:"100%",background:C.gold,transition:"width 0.3s"}}/>
          </div>
        )}
        {status?.total > 0 && (
          <div style={{fontSize:10,color:C.muted}}>{status.completed?.toLocaleString()} / {status.total?.toLocaleString()} ({pct}%)</div>
        )}
        <div style={{fontSize:9,color:C.muted,marginTop:8}}>
          Full progress updates go to Telegram every ~10min — this panel is a quick check, not the source of truth.
        </div>
      </div>

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>Run Validation Funnel</div>

        <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Engine</div>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          {["bos","ema","div","all"].map(e=>(
            <button key={e} onClick={()=>setEngine(e)} style={{
              flex:1,padding:"8px 4px",borderRadius:6,fontSize:10,fontWeight:700,textTransform:"uppercase",
              background:engine===e?C.accentDim:"transparent",
              color:engine===e?C.accent:C.muted,
              border:`1px solid ${engine===e?C.accent:C.border}`,cursor:"pointer"
            }}>{e}</button>
          ))}
        </div>

        <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Stage</div>
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          {[["sweep","1. Sweep"],["stability","2. Stability"],["monthly","3. Monthly"]].map(([s,label])=>(
            <button key={s} onClick={()=>setStage(s)} style={{
              flex:1,padding:"8px 4px",borderRadius:6,fontSize:10,fontWeight:700,
              background:stage===s?C.goldDim:"transparent",
              color:stage===s?C.gold:C.muted,
              border:`1px solid ${stage===s?C.gold:C.border}`,cursor:"pointer"
            }}>{label}</button>
          ))}
        </div>

        <div style={{display:"flex",gap:8}}>
          <Btn onClick={trigger} disabled={busy||isRunning} filled color={C.accent}>Run</Btn>
          <Btn onClick={prefetch} disabled={busy||isRunning} color={C.gold}>Prefetch Candles</Btn>
        </div>

        {msg && <div style={{fontSize:10,color:C.muted,marginTop:10}}>{msg}</div>}
      </div>

      <div style={{fontSize:9,color:C.muted,lineHeight:1.6,padding:"0 4px"}}>
        Stage 1 (Sweep) tests the full parameter space and only saves combos that pass the filter
        (30+ trades, Sharpe 0.5–2.5, max drawdown ≤35%). Stage 2 (Stability) re-tests the locked
        configs across 3 periods. Stage 3 (Monthly) checks 18 months of consistency. Results land
        in Supabase — use the export/CSV-to-Telegram endpoints to pull them for review.
      </div>
    </div>
  );
}

// ── PAPER TRADE TAB ──────────────────────────────────────────
function PaperTab() {
  const [data,  setData]  = React.useState(null);
  const [byLabel, setByLabel] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  const load = async () => {
    setLoading(true);
    try {
      const [j, bl] = await Promise.all([
        fetch(`${API}/journal`).then(r=>r.json()),
        fetch(`${API}/journal/by-label`).then(r=>r.json()),
      ]);
      setData(j); setByLabel(bl);
    } catch(e) {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  if (loading) return <div style={{color:C.muted,fontSize:11,padding:20,textAlign:"center"}}>Loading…</div>;

  const acc = data?.account;
  const trades = data?.trades || [];
  const labels = byLabel?.by_label || {};

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>Paper Trading</span>
        <Btn onClick={load} color={C.blue}>↻ Refresh</Btn>
      </div>

      {acc && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
          <StatCard label="Balance" value={`$${acc.balance?.toFixed(2)}`} color={C.accent}/>
          <StatCard label="Total PnL" value={`$${acc.total_pnl?.toFixed(2)}`} color={acc.total_pnl>=0?C.accent:C.red}/>
          <StatCard label="Trades" value={acc.total_trades} sub={`${acc.wins}W / ${acc.losses}L`}/>
          <StatCard label="Max DD" value={`${acc.max_drawdown?.toFixed(1)}%`} color={C.red}/>
        </div>
      )}

      <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>By Config</div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:16}}>
        {Object.keys(labels).length===0 && <div style={{padding:16,fontSize:11,color:C.muted,textAlign:"center"}}>No trades logged yet</div>}
        {Object.entries(labels).map(([label,d],i)=>(
          <div key={label} style={{padding:"10px 14px",borderTop:i>0?`1px solid ${C.border}`:"none",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:11,color:C.text,fontWeight:600}}>{label}</div>
              <div style={{fontSize:9,color:C.muted}}>{d.engine} · {d.trades} trades · {d.win_rate}% WR</div>
            </div>
            <div style={{fontSize:13,fontWeight:700,color:d.total_pnl>=0?C.accent:C.red}}>
              {d.total_pnl>=0?"+":""}{d.total_pnl}
            </div>
          </div>
        ))}
      </div>

      <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Recent Trades</div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {trades.length===0 && <div style={{padding:16,fontSize:11,color:C.muted,textAlign:"center"}}>No trades yet</div>}
        {trades.slice(0,20).map((t,i)=>(
          <div key={t.id||i} style={{padding:"8px 14px",borderTop:i>0?`1px solid ${C.border}`:"none",display:"flex",justifyContent:"space-between"}}>
            <div style={{fontSize:10,color:C.text}}>{t.symbol} {t.timeframe} <span style={{color:C.muted}}>{t.direction}</span></div>
            <div style={{fontSize:10,fontWeight:700,color:t.won?C.accent:C.red}}>{t.pnl>=0?"+":""}{t.pnl}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState("runner");
  const tabs = [["runner","Runner",C.gold],["paper","Paper Trade",C.accent]];

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,padding:"20px 16px",maxWidth:600,margin:"0 auto"}}>
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,boxShadow:`0 0 8px ${C.accent}`}}/>
          <span style={{fontSize:10,color:C.accent,letterSpacing:"0.2em",textTransform:"uppercase"}}>Waddle Fib Engine v2.0</span>
        </div>
        <h1 style={{fontSize:24,fontWeight:800,letterSpacing:"-0.03em"}}>WADDLE</h1>
      </div>

      <div style={{display:"flex",gap:0,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:20}}>
        {tabs.map(([id,label,color])=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            flex:1,padding:"12px 4px",
            background:tab===id?C.card:"transparent",
            color:tab===id?color:C.muted,
            border:"none",
            borderBottom:tab===id?`2px solid ${color}`:"2px solid transparent",
            fontSize:11,fontWeight:tab===id?700:400,
            cursor:"pointer",letterSpacing:"0.06em",textTransform:"uppercase"
          }}>{label}</button>
        ))}
      </div>

      {tab==="runner" && <RunnerTab/>}
      {tab==="paper"  && <PaperTab/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
