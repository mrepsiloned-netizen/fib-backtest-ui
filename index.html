<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07090f; color: #e6edf3; font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
select { appearance: none; -webkit-appearance: none; width: 100%; }
button { font-family: 'IBM Plex Mono', monospace; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #1c2433; border-radius: 2px; }
.sortable { cursor: pointer; user-select: none; }
.sortable:hover { color: #00ff9d !important; }
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#00ff9d;font-family:monospace;">Loading...</div></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useEffect } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, ReferenceLine, BarChart, Bar } = Recharts;

const API = "https://web-production-85d80.up.railway.app";

const C = {
  bg:"#07090f", surface:"#0d1117", card:"#111820", border:"#1c2433",
  accent:"#00ff9d", accentDim:"#00ff9d15", red:"#ff4466", redDim:"#ff446615",
  gold:"#ffd666", goldDim:"#ffd66615", blue:"#3b8bff", blueDim:"#3b8bff15",
  text:"#e6edf3", muted:"#6e7681", dim:"#21262d",
};

const ALL_PAIRS      = ["INJ/USDT","BTC/USDT","ETH/USDT","SOL/USDT","BNB/USDT","XRP/USDT"];
const ALL_TIMEFRAMES = ["1m","5m","15m","1h","4h","1d"];
const ALL_RISKS      = ["fixed","half_kelly","full_kelly"];
const ALL_PIVOTS     = [3,5,8];
const ALL_RR         = [1.5,2,3,4];
const ALL_FIB        = [0.382,0.5,0.618,0.705];
const PERIODS = [
  {label:"Last 7 Days",  start:null,end:"now",days:7},
  {label:"Last 30 Days", start:null,end:"now",days:30},
  {label:"Last 90 Days", start:null,end:"now",days:90},
  {label:"2025 Full",    start:"2025-01-01",end:"2026-01-01",days:365},
  {label:"2026 YTD",     start:"2026-01-01",end:"now",days:null},
  {label:"Rolling 1Y",   start:null,end:"now",days:365},
];
const RISK_LABELS = {fixed:"Fixed 2%",half_kelly:"Half Kelly",full_kelly:"Full Kelly"};
const fmt     = (n,d=2) => Number(n||0).toFixed(d);
const fmtDate = (ts) => new Date(ts).toLocaleDateString("en-MY",{month:"short",day:"numeric"});
const fmtRisk = (r) => RISK_LABELS[r]||r;
function getPeriodDates(p){
  if(!p) return {start:"2025-01-01",end:"2026-01-01"};
  const now=new Date();
  if(p.start) return {start:p.start,end:p.end};
  if(p.days){const d=new Date(now.getTime()-p.days*86400000);return{start:d.toISOString().split("T")[0],end:"now"};}
  return {start:"2025-01-01",end:"now"};
}
function toggle(arr,val){return arr.includes(val)?arr.filter(x=>x!==val):[...arr,val];}

// ── EXPORT ────────────────────────────────────────────────
function exportCSV(data,filename){
  if(!data||!data.length) return;
  const headers=Object.keys(data[0]);
  const rows=data.map(r=>headers.map(h=>{const v=r[h];if(typeof v==="string"&&v.includes(","))return `"${v}"`;return v==null?"":v;}).join(","));
  const csv=[headers.join(","),...rows].join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
function copyTable(data){
  if(!data||!data.length) return;
  const headers=Object.keys(data[0]);
  const rows=data.map(r=>headers.map(h=>r[h]==null?"-":r[h]).join("\t"));
  const text=[headers.join("\t"),...rows].join("\n");
  navigator.clipboard.writeText(text).then(()=>alert("Copied! Paste into Excel or Claude."));
}

// ── SHARED ────────────────────────────────────────────────
function StatCard({label,value,sub,color}){
  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px"}}>
      <div style={{fontSize:9,color:C.muted,letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:4}}>{label}</div>
      <div style={{fontSize:18,fontWeight:800,color:color||C.text}}>{value}</div>
      {sub&&<div style={{fontSize:10,color:C.muted,marginTop:2}}>{sub}</div>}
    </div>
  );
}
function Sel({label,value,onChange,options}){
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase"}}>{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:12,cursor:"pointer",outline:"none"}}>
        {options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
      </select>
    </div>
  );
}
function Toggle({label,value,onChange,color}){
  const c=color||C.accent;
  return (
    <div onClick={()=>onChange(!value)} style={{background:value?`${c}15`:C.card,border:`1px solid ${value?c:C.border}`,borderRadius:6,padding:"6px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>
      <div style={{width:7,height:7,borderRadius:"50%",background:value?c:C.muted,flexShrink:0}}/>
      <span style={{fontSize:11,color:value?c:C.muted}}>{label}</span>
    </div>
  );
}
function ProgressBar({value,total}){
  const pct=total?(value/total*100):0;
  return <div style={{marginTop:10,background:C.dim,borderRadius:4,height:4}}><div style={{background:C.accent,height:4,borderRadius:4,width:`${pct}%`,transition:"width 0.3s"}}/></div>;
}
const EqTip=({active,payload})=>{
  if(!active||!payload||!payload.length) return null;
  return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:11}}><div style={{color:C.muted}}>{fmtDate(payload[0].payload.t)}</div><div style={{color:C.accent,fontWeight:700}}>${fmt(payload[0].payload.eq)}</div></div>;
};

// ── SINGLE ────────────────────────────────────────────────
function SingleTab(){
  const [symbol,setSymbol]=useState("BTC/USDT");
  const [tf,setTf]=useState("15m");
  const [period,setPeriod]=useState(3);
  const [risk,setRisk]=useState("fixed");
  const [pivotN,setPivotN]=useState(5);
  const [rr,setRr]=useState(2);
  const [fib,setFib]=useState(0.618);
  const [status,setStatus]=useState("idle");
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [chartTab,setChartTab]=useState("curve");

  const run=useCallback(async()=>{
    setStatus("loading");setResult(null);setError("");
    try{
      const {start,end}=getPeriodDates(PERIODS[period]);
      const res=await fetch(`${API}/backtest`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({symbol,timeframe:tf,start_date:start,end_date:end,pivot_n:pivotN,risk_method:risk,risk_pct:0.02,rr,fib_level:fib})});
      const data=await res.json();
      if(!data.success) throw new Error(data.error);
      setResult(data);setStatus("done");
    }catch(e){setError(e.message);setStatus("error");}
  },[symbol,tf,period,risk,pivotN,rr,fib]);

  const s=result&&result.stats, green=s&&s.total_return>=0, col=green?C.accent:C.red;
  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Sel label="Pair" value={symbol} onChange={setSymbol} options={ALL_PAIRS.map(p=>({value:p,label:p}))}/>
          <Sel label="Timeframe" value={tf} onChange={setTf} options={ALL_TIMEFRAMES.map(t=>({value:t,label:t.toUpperCase()}))}/>
          <Sel label="Period" value={period} onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))}/>
          <Sel label="Pivot N" value={pivotN} onChange={v=>setPivotN(+v)} options={ALL_PIVOTS.map(n=>({value:n,label:`N=${n}`}))}/>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.blue,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Fib Level</span>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ALL_FIB.map(f=><div key={f} onClick={()=>setFib(f)} style={{background:fib===f?C.blueDim:C.card,border:`1px solid ${fib===f?C.blue:C.border}`,borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,color:fib===f?C.blue:C.text,fontWeight:fib===f?700:400}}>{f}</div>)}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Risk:Reward</span>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ALL_RR.map(r=><div key={r} onClick={()=>setRr(r)} style={{background:rr===r?C.accentDim:C.card,border:`1px solid ${rr===r?C.accent:C.border}`,borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,color:rr===r?C.accent:C.text,fontWeight:rr===r?700:400}}>{r}R</div>)}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Risk Method</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[{value:"fixed",label:"Fixed 2%",desc:"Safe"},{value:"half_kelly",label:"Half Kelly",desc:"Balanced"},{value:"full_kelly",label:"Full Kelly",desc:"Max"}].map(m=>(
              <div key={m.value} onClick={()=>setRisk(m.value)} style={{background:risk===m.value?C.accentDim:C.card,border:`1px solid ${risk===m.value?C.accent:C.border}`,borderRadius:8,padding:"10px 8px",cursor:"pointer"}}>
                <div style={{fontSize:11,fontWeight:700,color:risk===m.value?C.accent:C.text,marginBottom:2}}>{m.label}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.desc}</div>
              </div>
            ))}
          </div>
        </div>
        <button onClick={run} disabled={status==="loading"} style={{background:status==="loading"?C.dim:C.accent,color:C.bg,border:"none",borderRadius:8,padding:12,fontSize:13,fontWeight:800,cursor:status==="loading"?"not-allowed":"pointer",letterSpacing:"0.08em",width:"100%"}}>
          {status==="loading"?"⟳ RUNNING...":"▶ RUN BACKTEST"}
        </button>
        {status==="error"&&<div style={{color:C.red,fontSize:11,textAlign:"center",marginTop:8}}>✗ {error}</div>}
      </div>
      {status==="done"&&result&&s&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.muted}}>SRC: {result.source}</span>
            <span style={{background:C.blueDim,border:`1px solid ${C.blue}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.blue}}>FIB: {fib}</span>
            <span style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,color:C.gold}}>RR: {result.rr}R</span>
          </div>
          <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:C.muted}}>TOTAL RETURN</div>
              <div style={{fontSize:40,fontWeight:800,color:col,lineHeight:1}}>{green?"+":""}{fmt(s.total_return)}%</div>
            </div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:13,marginBottom:4}}>$100 → <strong style={{color:col}}>${fmt(s.final_equity)}</strong></div>
              <div style={{fontSize:11,color:C.muted}}>{s.total_trades} trades · {s.wins}W/{s.losses}L · {fmt(s.win_rate)}% WR</div>
              <div style={{fontSize:11,color:C.muted}}>CAGR {fmt(s.cagr)}% · DD -{fmt(s.max_drawdown)}% · Sharpe {fmt(s.sharpe)}</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
            <StatCard label="Final Equity" value={`$${fmt(s.final_equity)}`} color={col}/>
            <StatCard label="CAGR" value={`${fmt(s.cagr)}%`} color={C.gold} sub="annualised"/>
            <StatCard label="Win Rate" value={`${fmt(s.win_rate)}%`} sub={`${s.wins}W/${s.losses}L`}/>
            <StatCard label="Profit Factor" value={fmt(s.profit_factor)} color={s.profit_factor>=1.5?C.accent:C.red}/>
            <StatCard label="Max Drawdown" value={`-${fmt(s.max_drawdown)}%`} color={C.red}/>
            <StatCard label="Sharpe" value={fmt(s.sharpe)} color={s.sharpe>=1?C.accent:C.muted}/>
            <StatCard label="Avg Win $" value={`$${fmt(s.avg_win,3)}`} color={C.accent}/>
            <StatCard label="Avg Loss $" value={`$${fmt(s.avg_loss,3)}`} color={C.red}/>
            <StatCard label="Max Consec W" value={s.max_consec_wins} color={C.accent}/>
            <StatCard label="Max Consec L" value={s.max_consec_losses} color={C.red}/>
            <StatCard label="Kelly Full" value={`${fmt(s.kelly_full*100,1)}%`} color={C.gold}/>
            <StatCard label="Daily Avg" value={`${fmt(s.daily_return,3)}%`}/>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
            <div style={{display:"flex",borderBottom:`1px solid ${C.border}`}}>
              {[["curve","Equity"],["dd","Drawdown"],["pnl","PnL"]].map(([id,label])=>(
                <button key={id} onClick={()=>setChartTab(id)} style={{flex:1,padding:"10px 8px",background:chartTab===id?C.card:"transparent",color:chartTab===id?C.accent:C.muted,border:"none",borderBottom:chartTab===id?`2px solid ${C.accent}`:"2px solid transparent",fontSize:10,cursor:"pointer",textTransform:"uppercase"}}>{label}</button>
              ))}
            </div>
            <div style={{padding:"16px 8px"}}>
              {chartTab==="curve"&&(
                <ResponsiveContainer width="100%" height={200}>
                  <AreaChart data={result.equity_curve} margin={{top:4,right:4,left:0,bottom:0}}>
                    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={col} stopOpacity={0.3}/><stop offset="95%" stopColor={col} stopOpacity={0}/></linearGradient></defs>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                    <XAxis dataKey="t" tickFormatter={fmtDate} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                    <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={44}/>
                    <Tooltip content={EqTip}/>
                    <ReferenceLine y={100} stroke={C.muted} strokeDasharray="4 4"/>
                    <Area type="monotone" dataKey="eq" stroke={col} strokeWidth={2} fill="url(#g1)" dot={false}/>
                  </AreaChart>
                </ResponsiveContainer>
              )}
              {chartTab==="pnl"&&(
                <ResponsiveContainer width="100%" height={200}>
                  <BarChart data={result.trades} margin={{top:4,right:4,left:0,bottom:0}}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                    <XAxis dataKey="id" tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false}/>
                    <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} width={44}/>
                    <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                    <ReferenceLine y={0} stroke={C.muted}/>
                    <Bar dataKey="pnl" fill={C.accent} radius={[2,2,0,0]}/>
                  </BarChart>
                </ResponsiveContainer>
              )}
            </div>
          </div>
        </div>
      )}
      {status==="idle"&&<div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>Configure and hit <span style={{color:C.accent}}>▶ RUN BACKTEST</span></div>}
    </div>
  );
}

// ── MATRIX ────────────────────────────────────────────────
function MatrixTab(){
  const [selPairs,setSelPairs]=useState(["BTC/USDT","ETH/USDT","SOL/USDT"]);
  const [selTfs,setSelTfs]=useState(["15m"]);
  const [selRisks,setSelRisks]=useState(["fixed"]);
  const [selPivots,setSelPivots]=useState([3,5]);
  const [selRR,setSelRR]=useState([2,4]);
  const [selFib,setSelFib]=useState([0.618]);
  const [period,setPeriod]=useState(3);
  const [status,setStatus]=useState("idle");
  const [results,setResults]=useState([]);
  const [progress,setProgress]=useState(0);
  const [total,setTotal]=useState(0);
  const [sortKey,setSortKey]=useState("total_return");
  const [sortDir,setSortDir]=useState("desc");
  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);

  const tog=(arr,setArr,val)=>setArr(toggle(arr,val));
  const totalCombos=selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length*selFib.length;

  const run=useCallback(async()=>{
    if(!totalCombos) return;
    setStatus("loading");setResults([]);setProgress(0);setError("");
    const {start,end}=getPeriodDates(PERIODS[period]);
    const configs=[];
    for(const sym of selPairs) for(const tf of selTfs) for(const r of selRisks)
      for(const pn of selPivots) for(const rr of selRR) for(const fib of selFib)
        configs.push({symbol:sym,timeframe:tf,start_date:start,end_date:end,pivot_n:pn,risk_method:r,risk_pct:0.02,rr,fib_level:fib});
    setTotal(configs.length);
    const all=[];
    for(let i=0;i<configs.length;i+=8){
      try{
        const res=await fetch(`${API}/batch`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({configs:configs.slice(i,i+8)})});
        const data=await res.json();
        if(data.success){all.push(...data.results);setProgress(all.length);setResults([...all]);}
      }catch(e){setError(e.message);}
    }
    setStatus("done");
  },[selPairs,selTfs,selRisks,selPivots,selRR,selFib,period,totalCombos]);

  const sorted=useMemo(()=>{
    const ok=results.filter(r=>r.success&&r.stats);
    return [...ok].sort((a,b)=>{const va=a.stats[sortKey]||0,vb=b.stats[sortKey]||0;return sortDir==="desc"?vb-va:va-vb;});
  },[results,sortKey,sortDir]);

  const exportData=useMemo(()=>sorted.map(r=>({
    symbol:r.symbol,timeframe:r.timeframe,risk:fmtRisk(r.risk_method),pivot_n:r.pivot_n,rr:r.rr,fib:r.fib_level||0.618,
    return_pct:r.stats.total_return,cagr:r.stats.cagr,max_dd:r.stats.max_drawdown,
    sharpe:r.stats.sharpe,profit_factor:r.stats.profit_factor,win_rate:r.stats.win_rate,trades:r.stats.total_trades
  })),[sorted]);

  const handleSort=k=>{if(sortKey===k)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortKey(k);setSortDir("desc");}};
  const SortTh=({k,label})=>(
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 8px",color:sortKey===k?C.accent:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  const groups=[
    ["Pairs",ALL_PAIRS,selPairs,setSelPairs,p=>p.replace("/USDT",""),false],
    ["Timeframes",ALL_TIMEFRAMES,selTfs,setSelTfs,t=>t.toUpperCase(),false],
    ["Risk",ALL_RISKS,selRisks,setSelRisks,fmtRisk,false],
    ["Pivot N",ALL_PIVOTS,selPivots,setSelPivots,n=>`N=${n}`,false],
    ["RR",ALL_RR,selRR,setSelRR,r=>`${r}R`,false],
    ["Fib Level",ALL_FIB,selFib,setSelFib,f=>`${f}`,true],
  ];

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        {groups.map(([label,all,sel,setSel,fmtV,isBlue])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:isBlue?C.blue:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmtV(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)} color={isBlue?C.blue:C.accent}/>)}
            </div>
          </div>
        ))}
        <div style={{marginBottom:14}}><Sel label="Period" value={period} onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))}/></div>

              <button onClick={()=>exportCSV(exportData,`matrix_${Date.now()}.csv`)} style={{background:C.card,color:C.gold,border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 10px",fontSize:10,cursor:"pointer"}}>⬇ CSV</button>
            </div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:C.bg}}>
                <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>Pair</th>
                <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>TF</th>
                <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>Risk</th>
                <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>N</th>
                <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>RR</th>

                <SortTh k="win_rate" label="WR %"/>

// ── COMPARE ────────────────────────────────────────────────
function CompareTab(){
  const [selPairs,setSelPairs]=useState(["BTC/USDT","ETH/USDT","SOL/USDT"]);
  const [selTfs,setSelTfs]=useState(["15m"]);
  const [selRisks,setSelRisks]=useState(["fixed"]);
  const [selPivots,setSelPivots]=useState([3,5]);
  const [selRR,setSelRR]=useState([2,4]);
  const [periodA,setPeriodA]=useState({label:"2025 Full",start:"2025-01-01",end:"2026-01-01"});
  const [periodB,setPeriodB]=useState({label:"2026 YTD",start:"2026-01-01",end:"now"});
  const [status,setStatus]=useState("idle");
  const [results,setResults]=useState([]);
  const [sortKey,setSortKey]=useState("consistency_score");
  const [sortDir,setSortDir]=useState("desc");
  const [filter,setFilter]=useState("all");
  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);

  const tog=(arr,setArr,val)=>setArr(toggle(arr,val));
  const totalCombos=selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length;

  const PRESETS=[
    {label:"Last 7 Days",start:null,end:"now",days:7},
    {label:"Last 30 Days",start:null,end:"now",days:30},
    {label:"Last 90 Days",start:null,end:"now",days:90},
    {label:"2025 Full",start:"2025-01-01",end:"2026-01-01"},
    {label:"2026 YTD",start:"2026-01-01",end:"now"},
  ];

  const run=useCallback(async()=>{
    if(!totalCombos) return;
    setStatus("loading");setResults([]);setError("");
    const getS=p=>{if(p.start)return p.start;const d=new Date(Date.now()-p.days*86400000);return d.toISOString().split("T")[0];};
    try{
      const res=await fetch(`${API}/compare`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({symbols:selPairs,timeframes:selTfs,pivot_ns:selPivots,risk_methods:selRisks,rr_ratios:selRR,
          period_a_start:getS(periodA),period_a_end:periodA.end,period_b_start:getS(periodB),period_b_end:periodB.end})});
      const data=await res.json();
      if(!data.success) throw new Error(data.error||"Failed");
      setResults(data.results);setStatus("done");
    }catch(e){setError(e.message);setStatus("error");}
  },[selPairs,selTfs,selRisks,selPivots,selRR,periodA,periodB,totalCombos]);

  const filtered=useMemo(()=>{
    let r=[...results];
    if(filter==="both_positive") r=r.filter(x=>x.both_positive);
    if(filter==="top20") r=r.slice(0,20);
    return [...r].sort((a,b)=>{const va=a[sortKey]||0,vb=b[sortKey]||0;return sortDir==="desc"?vb-va:va-vb;});
  },[results,filter,sortKey,sortDir]);

  const exportData=useMemo(()=>filtered.map(r=>({
    symbol:r.symbol,timeframe:r.timeframe,risk:fmtRisk(r.risk),pivot_n:r.pivot_n,rr:r.rr,
    period_a:r.period_a_return,period_b:r.period_b_return,avg_return:r.avg_return,
    avg_dd:r.avg_dd,avg_sharpe:r.avg_sharpe,score:r.consistency_score
  })),[filtered]);

  const handleSort=k=>{if(sortKey===k)setSortDir(d=>d==="desc"?"asc":"desc");else{setSortKey(k);setSortDir("desc");}};
  const SortTh=({k,label})=>(
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 8px",color:sortKey===k?C.accent:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Period A vs B</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:9,color:C.accent,marginBottom:6}}>PERIOD A</div>
              {PRESETS.map(p=><div key={p.label} onClick={()=>setPeriodA(p)} style={{background:periodA.label===p.label?C.accentDim:C.card,border:`1px solid ${periodA.label===p.label?C.accent:C.border}`,borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:11,color:periodA.label===p.label?C.accent:C.muted,marginBottom:4}}>{p.label}</div>)}
            </div>
            <div>
              <div style={{fontSize:9,color:C.gold,marginBottom:6}}>PERIOD B</div>
              {PRESETS.map(p=><div key={p.label} onClick={()=>setPeriodB(p)} style={{background:periodB.label===p.label?C.goldDim:C.card,border:`1px solid ${periodB.label===p.label?C.gold:C.border}`,borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:11,color:periodB.label===p.label?C.gold:C.muted,marginBottom:4}}>{p.label}</div>)}
            </div>
          </div>
        </div>
        {[
          ["Pairs",ALL_PAIRS,selPairs,setSelPairs,p=>p.replace("/USDT",""),false],
          ["Timeframes",ALL_TIMEFRAMES,selTfs,setSelTfs,t=>t.toUpperCase(),false],
          ["Risk",ALL_RISKS,selRisks,setSelRisks,fmtRisk,false],
          ["Pivot N",ALL_PIVOTS,selPivots,setSelPivots,n=>`N=${n}`,false],
          ["RR",ALL_RR,selRR,setSelRR,r=>`${r}R`,false],
        ].map(([label,all,sel,setSel,fmtV])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmtV(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)}/>)}
            </div>
          </div>
        ))}
        <button onClick={run} disabled={status==="loading"||!totalCombos} style={{background:status==="loading"||!totalCombos?C.dim:C.gold,color:C.bg,border:"none",borderRadius:8,padding:"12px 20px",fontSize:13,fontWeight:800,cursor:status==="loading"||!totalCombos?"not-allowed":"pointer",width:"100%"}}>
          {status==="loading"?"⟳ COMPARING...":`⚖ COMPARE ${totalCombos} COMBOS × 2 PERIODS`}
        </button>
        {error&&<div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {error}</div>}
      </div>
      {results.length>0&&(
        <div>
          {filtered[0]&&(
            <div style={{background:C.goldDim,border:`1px solid ${C.gold}`,borderRadius:12,padding:"14px 18px",marginBottom:16}}>
              <div style={{fontSize:10,color:C.gold,marginBottom:6}}>⭐ MOST CONSISTENT</div>
              <div style={{fontSize:16,fontWeight:800}}>{filtered[0].symbol.replace("/USDT","")} {(filtered[0].timeframe||"").toUpperCase()} · {fmtRisk(filtered[0].risk)} · N={filtered[0].pivot_n} · {filtered[0].rr}R</div>
              <div style={{fontSize:12,color:C.muted,marginTop:4}}>
                {periodA.label}: <span style={{color:filtered[0].period_a_return>=0?C.accent:C.red,fontWeight:700}}>{filtered[0].period_a_return>=0?"+":""}{fmt(filtered[0].period_a_return)}%</span>
                {" · "}{periodB.label}: <span style={{color:filtered[0].period_b_return>=0?C.gold:C.red,fontWeight:700}}>{filtered[0].period_b_return>=0?"+":""}{fmt(filtered[0].period_b_return)}%</span>
                {" · "}Score: <span style={{color:C.gold,fontWeight:700}}>{fmt(filtered[0].consistency_score)}</span>
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
            {[["all","All"],["both_positive","Both +"],["top20","Top 20"]].map(([v,l])=>(
              <div key={v} onClick={()=>setFilter(v)} style={{background:filter===v?C.accentDim:C.card,border:`1px solid ${filter===v?C.accent:C.border}`,borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:10,color:filter===v?C.accent:C.muted}}>{l}</div>
            ))}
            <div style={{marginLeft:"auto",display:"flex",gap:8}}>
              <button onClick={()=>{copyTable(exportData);setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={{background:C.card,color:copied?C.accent:C.muted,border:`1px solid ${copied?C.accent:C.border}`,borderRadius:6,padding:"5px 10px",fontSize:10,cursor:"pointer"}}>{copied?"✅":"📋"} Copy</button>
              <button onClick={()=>exportCSV(exportData,`compare_${Date.now()}.csv`)} style={{background:C.card,color:C.gold,border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 10px",fontSize:10,cursor:"pointer"}}>⬇ CSV</button>
              <span style={{fontSize:10,color:C.muted,alignSelf:"center"}}>{filtered.length}</span>
            </div>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>Pair</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>TF</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>N</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,fontSize:9}}>RR</th>
                  <SortTh k="period_a_return" label={`${periodA.label}`}/>
                  <SortTh k="period_b_return" label={`${periodB.label}`}/>
                  <SortTh k="avg_return" label="Avg"/>
                  <SortTh k="avg_sharpe" label="Sharpe"/>
                  <SortTh k="consistency_score" label="Score ⭐"/>
                </tr></thead>
                <tbody>
                  {filtered.map((r,i)=>{
                    const isTop=i===0;
                    return (
                      <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:isTop?C.goldDim:r.both_positive?"#00ff9d08":"transparent"}}>
                        <td style={{padding:"6px 8px",fontWeight:isTop?700:400,color:isTop?C.gold:C.text}}>{r.symbol.replace("/USDT","")}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{(r.timeframe||"").toUpperCase()}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{r.pivot_n}</td>
                        <td style={{padding:"6px 8px",color:C.gold}}>{r.rr}R</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_a_return>=0?C.accent:C.red,fontWeight:700}}>{r.period_a_return>=0?"+":""}{fmt(r.period_a_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_b_return>=0?C.gold:C.red,fontWeight:700}}>{r.period_b_return>=0?"+":""}{fmt(r.period_b_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_return>=0?C.accent:C.red}}>{r.avg_return>=0?"+":""}{fmt(r.avg_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_sharpe>=1?C.accent:C.muted}}>{fmt(r.avg_sharpe)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.gold,fontWeight:isTop?700:400}}>{fmt(r.consistency_score)}</td>
                      </tr>
                    );
                  })}

              </table>
            </div>
          </div>
        </div>
      )}
      {status==="idle"&&<div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>Select periods and hit <span style={{color:C.gold}}>⚖ COMPARE</span></div>}
    </div>
  );

// ── JOURNAL ────────────────────────────────────────────────
function JournalTab(){
  const [account,setAccount]=useState(null);
  const [trades,setTrades]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState("");
  const [filterPair,setFilterPair]=useState("all");
  const [filterResult,setFilterResult]=useState("all");
  const [subtab,setSubtab]=useState("overview");

  const load=useCallback(async()=>{
    setLoading(true);setError("");
    try{
      const res=await fetch(`${API}/journal`);
      const data=await res.json();
      if(data.success){setAccount(data.account||null);setTrades(Array.isArray(data.trades)?data.trades:[]);}
      else throw new Error(data.error||"Failed");
    }catch(e){setError(e.message);}
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[]);

  const pairs=useMemo(()=>["all",...new Set(trades.map(t=>t.symbol))],[trades]);

  const filtered=useMemo(()=>trades.filter(t=>{
    if(filterPair!=="all"&&t.symbol!==filterPair) return false;
    if(filterResult==="win"&&!t.won) return false;
    if(filterResult==="loss"&&t.won) return false;
    return true;
  }),[trades,filterPair,filterResult]);

  const stats=useMemo(()=>{
    if(!filtered.length) return null;
    const wins=filtered.filter(t=>t.won),losses=filtered.filter(t=>!t.won);
    const totalPnl=filtered.reduce((a,t)=>a+(t.pnl||0),0);
    const wr=wins.length/filtered.length*100;
    const avgWin=wins.length?wins.reduce((a,t)=>a+(t.pnl||0),0)/wins.length:0;
    const avgLoss=losses.length?Math.abs(losses.reduce((a,t)=>a+(t.pnl||0),0)/losses.length):0;
    return{wins:wins.length,losses:losses.length,total:filtered.length,totalPnl,wr,avgWin,avgLoss,pf:avgLoss>0?avgWin/avgLoss:999};
  },[filtered]);

  const curve=useMemo(()=>{let eq=100;return [...filtered].reverse().map(t=>{eq+=(t.pnl||0);return{t:t.created_at,eq:Math.round(eq*100)/100};});},[filtered]);

  const acc=account;
  const totalRet=acc?Math.round(((acc.balance-100)/100*100)*100)/100:0;
  const green=totalRet>=0;
  const col=green?C.accent:C.red;
  const fmtD=s=>s?new Date(s).toLocaleDateString("en-MY",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
  const sel={background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,cursor:"pointer",outline:"none"};

  if(loading) return <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>⟳ Loading...</div>;
  if(error) return <div style={{color:C.red,fontSize:12,padding:16,background:C.redDim,border:`1px solid ${C.red}`,borderRadius:8}}>✗ {error}<br/><button onClick={load} style={{marginTop:8,background:C.card,color:C.accent,border:`1px solid ${C.accent}`,borderRadius:6,padding:"5px 12px",fontSize:10,cursor:"pointer"}}>Retry</button></div>;

  return (
    <div>
      {acc?(
        <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:10,color:C.muted}}>ACCOUNT BALANCE</div>
            <div style={{fontSize:34,fontWeight:800,color:col,lineHeight:1}}>${fmt(acc.balance)}</div>
          </div>
          <div style={{flex:1,minWidth:160}}>
            <div style={{fontSize:13,marginBottom:4}}>Return: <strong style={{color:col}}>{green?"+":""}{fmt(totalRet)}%</strong></div>
            <div style={{fontSize:11,color:C.muted}}>{acc.total_trades} trades · {acc.wins}W/{acc.losses}L · Max DD -{fmt(acc.max_drawdown)}%</div>
          </div>
          <button onClick={load} style={{background:C.card,color:C.accent,border:`1px solid ${C.accent}`,borderRadius:8,padding:"8px 14px",fontSize:10,cursor:"pointer"}}>↻ Refresh</button>
        </div>
      ):(
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades yet — waiting for first signal 🤖</div>
      )}

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{display:"flex",flexDirection:"column",gap:3}}>
            <span style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>Pair</span>
            <select value={filterPair} onChange={e=>setFilterPair(e.target.value)} style={sel}>
              {pairs.map(p=><option key={p} value={p}>{p==="all"?"All Pairs":p}</option>)}
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:3}}>
            <span style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>Result</span>
            <select value={filterResult} onChange={e=>setFilterResult(e.target.value)} style={sel}>
              <option value="all">All Results</option>
              <option value="win">Wins Only</option>
              <option value="loss">Losses Only</option>
            </select>
          </div>
        </div>
      </div>

      <div style={{display:"flex",gap:0,marginBottom:16,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {[["overview","Overview"],["chart","Equity"],["trades","Trade Log"]].map(([id,label])=>(
          <button key={id} onClick={()=>setSubtab(id)} style={{flex:1,padding:"10px 4px",background:subtab===id?C.card:"transparent",color:subtab===id?C.blue:C.muted,border:"none",borderBottom:subtab===id?`2px solid ${C.blue}`:"2px solid transparent",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}>{label}</button>
        ))}
      </div>

      {subtab==="overview"&&(
        !stats?<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>:(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
            <StatCard label="Total Trades" value={stats.total}/>
            <StatCard label="Win Rate" value={`${fmt(stats.wr)}%`} color={stats.wr>=50?C.accent:C.red} sub={`${stats.wins}W/${stats.losses}L`}/>
            <StatCard label="Total P&L" value={`${stats.totalPnl>=0?"+":""}$${fmt(stats.totalPnl)}`} color={stats.totalPnl>=0?C.accent:C.red}/>
            <StatCard label="Profit Factor" value={fmt(stats.pf)} color={stats.pf>=1.5?C.accent:C.red}/>
            <StatCard label="Avg Win $" value={`$${fmt(stats.avgWin)}`} color={C.accent}/>
            <StatCard label="Avg Loss $" value={`$${fmt(stats.avgLoss)}`} color={C.red}/>
          </div>
        )
      )}

      {subtab==="chart"&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",marginBottom:12}}>Equity Curve · $100 Start</div>
          {curve.length>1?(
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={curve} margin={{top:4,right:4,left:0,bottom:0}}>
                <defs><linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={C.blue} stopOpacity={0.3}/><stop offset="95%" stopColor={C.blue} stopOpacity={0}/></linearGradient></defs>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                <XAxis dataKey="t" tickFormatter={t=>new Date(t).toLocaleDateString("en-MY",{month:"short",day:"numeric"})} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={44}/>
                <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                <ReferenceLine y={100} stroke={C.muted} strokeDasharray="4 4"/>
                <Area type="monotone" dataKey="eq" stroke={C.blue} strokeWidth={2} fill="url(#jg)" dot={false}/>
              </AreaChart>
            </ResponsiveContainer>
          ):<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>Not enough trades yet</div>}
        </div>
      )}

      {subtab==="trades"&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,textTransform:"uppercase"}}>Trade Log · {filtered.length} trades</div>
          {filtered.length===0?<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades</div>:(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  {["Date","Pair","TF","Dir","Entry","Exit","RR","P&L","Balance","Strategy"].map(h=>(
                    <th key={h} style={{padding:"7px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {filtered.map((t,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:t.won?"#3b8bff08":"#ff446605"}}>
                      <td style={{padding:"6px 8px",color:C.muted,whiteSpace:"nowrap"}}>{fmtD(t.created_at)}</td>
                      <td style={{padding:"6px 8px",fontWeight:700}}>{(t.symbol||"").replace("/USDT","")}</td>
                      <td style={{padding:"6px 8px",color:C.muted}}>{(t.timeframe||"").toUpperCase()}</td>
                      <td style={{padding:"6px 8px"}}><span style={{background:t.direction==="LONG"?C.accentDim:C.redDim,color:t.direction==="LONG"?C.accent:C.red,padding:"2px 6px",borderRadius:3,fontSize:9,fontWeight:700}}>{t.direction}</span></td>
                      <td style={{padding:"6px 8px"}}>{fmt(t.entry,4)}</td>
                      <td style={{padding:"6px 8px"}}>{fmt(t.exit_price,4)}</td>
                      <td style={{padding:"6px 8px",color:C.gold}}>{t.rr}R</td>
                      <td style={{padding:"6px 8px",color:t.pnl>=0?C.accent:C.red,fontWeight:700}}>{t.pnl>=0?"+":""}${fmt(t.pnl)}</td>
                      <td style={{padding:"6px 8px"}}>${fmt(t.balance)}</td>
                      <td style={{padding:"6px 8px",color:C.gold,fontSize:9}}>{t.label||"-"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("single");
  const tabs=[["single","Single"],["matrix","Matrix"],["compare","Compare"],["journal","Journal"]];
  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,padding:"20px 16px",maxWidth:900,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,boxShadow:`0 0 8px ${C.accent}`}}/>
          <span style={{fontSize:10,color:C.accent,letterSpacing:"0.2em",textTransform:"uppercase"}}>Fib Structure Engine v3</span>
        </div>
        <h1 style={{fontSize:26,fontWeight:800,letterSpacing:"-0.03em"}}>BACKTEST <span style={{color:C.accent}}>LAB</span></h1>
        <p style={{marginTop:4,fontSize:11,color:C.muted}}>1M–1D · Fib 0.382–0.705 · Variable RR · CSV Export · Journal</p>
      </div>
      <div style={{display:"flex",gap:0,marginBottom:20,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"12px 8px",background:tab===id?C.card:"transparent",color:tab===id?(id==="compare"?C.gold:id==="journal"?C.blue:C.accent):C.muted,border:"none",borderBottom:tab===id?`2px solid ${id==="compare"?C.gold:id==="journal"?C.blue:C.accent}`:"2px solid transparent",fontSize:11,fontWeight:tab===id?700:400,cursor:"pointer",textTransform:"uppercase"}}>{label}</button>
        ))}
      </div>
      {tab==="single"&&<SingleTab/>}
      {tab==="matrix"&&<MatrixTab/>}
      {tab==="compare"&&<CompareTab/>}
      {tab==="journal"&&<JournalTab/>}
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
