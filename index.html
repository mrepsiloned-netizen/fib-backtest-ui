// ── MATRIX TAB ─────────────────────────────────────────────────
function MatrixTab() {
  const [selPairs,      setSelPairs]      = useState(["XRP/USDT","DOGE/USDT","TRX/USDT"]);
  const [selTfs,        setSelTfs]        = useState(["1m"]);
  const [selRisks,      setSelRisks]      = useState(["fixed"]);
  const [selPivots,     setSelPivots]     = useState([8]);
  const [selRR,         setSelRR]         = useState([1.5,2]);
  const [selFibs,       setSelFibs]       = useState([0.618]);
  const [selEngines,    setSelEngines]    = useState(["original"]);
  const [selEntryModes, setSelEntryModes] = useState(["touch"]);
  const [period,        setPeriod]        = useState(3);
  const [status,        setStatus]        = useState("idle");
  const [results,       setResults]       = useState([]);
  const [progress,      setProgress]      = useState(0);
  const [total,         setTotal]         = useState(0);
  const [sortKey,       setSortKey]       = useState("total_return");
  const [sortDir,       setSortDir]       = useState("desc");
  const [error,         setError]         = useState("");

  const tog = (arr,setArr,val) => setArr(toggle(arr,val));
  const totalCombos = selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length*selFibs.length*selEngines.length*selEntryModes.length;

  const run = useCallback(async () => {
    if (!totalCombos) return;
    setStatus("loading"); setResults([]); setProgress(0); setError("");
    const {start,end} = getPeriodDates(PERIODS[period]);
    const configs = [];
    for(const sym of selPairs) for(const tf of selTfs) for(const risk of selRisks)
      for(const pn of selPivots) for(const rr of selRR) for(const fib of selFibs)
        for(const eng of selEngines) for(const em of selEntryModes)
          configs.push({symbol:sym,timeframe:tf,start_date:start,end_date:end,
            pivot_n:pn,risk_method:risk,risk_pct:0.02,rr,fib_level:fib,engine:eng,entry_mode:em});
    setTotal(configs.length);
    const allResults = [];
    for(let i=0; i<configs.length; i+=8) {
      const batch = configs.slice(i,i+8);
      try {
        const res  = await fetch(`${API}/batch`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({configs:batch})});
        const data = await res.json();
        if(data.success) { allResults.push(...data.results); setProgress(allResults.length); setResults([...allResults]); }
      } catch(e) { setError(e.message); }
    }
    setStatus("done");
  }, [selPairs,selTfs,selRisks,selPivots,selRR,selFibs,selEngines,selEntryModes,period,totalCombos]);

  const sorted = useMemo(() => {
    const ok = results.filter(r=>r.success&&r.stats);
    return [...ok].sort((a,b)=>{
      const va=a.stats[sortKey]??0, vb=b.stats[sortKey]??0;
      return sortDir==="desc"?vb-va:va-vb;
    });
  }, [results,sortKey,sortDir]);

  const handleSort = (k) => { if(sortKey===k) setSortDir(d=>d==="desc"?"asc":"desc"); else { setSortKey(k); setSortDir("desc"); } };
  const SortTh = ({k,label}) => (
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 10px",color:sortKey===k?C.accent:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  const exportCSV = () => {
    const headers=["Pair","TF","Risk","N","RR","Fib","Engine","EntryMode","Return%","CAGR%","MaxDD%","Sharpe","PF","WR%","Trades","AvgWin","AvgLoss","KellyFull"];
    const rows=sorted.map(r=>{const s=r.stats;return[
      r.symbol.replace("/USDT",""),r.timeframe,r.risk_method,r.pivot_n,r.rr,r.fib_level||0.618,
      r.engine||"—",r.entry_mode||"—",
      s.total_return,s.cagr,s.max_drawdown,s.sharpe,s.profit_factor,s.win_rate,s.total_trades,
      s.avg_win,s.avg_loss,s.kelly_full
    ].join(",");});
    const csv=[headers.join(","),...rows].join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="waddle_matrix.csv";a.click();
  };

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        {[
          ["Pairs",       ALL_PAIRS,    selPairs,      setSelPairs,      p=>p.replace("/USDT","")],
          ["Timeframes",  ALL_TIMEFRAMES,selTfs,       setSelTfs,        t=>t.toUpperCase()],
          ["Risk Methods",ALL_RISKS,    selRisks,      setSelRisks,      fmtRisk],
          ["Pivot N",     ALL_PIVOTS,   selPivots,     setSelPivots,     n=>`N=${n}`],
          ["Risk:Reward", ALL_RR,       selRR,         setSelRR,         r=>`${r}R`],
          ["Fib Level",   ALL_FIBS,     selFibs,       setSelFibs,       f=>`${f}`],
          ["Engine",      ALL_ENGINES,  selEngines,    setSelEngines,    e=>e],
          ["Entry Mode",  ALL_ENTRY,    selEntryModes, setSelEntryModes, e=>e],
        ].map(([label,all,sel,setSel,fmt])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmt(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)}/>)}
            </div>
          </div>
        ))}
        <div style={{marginBottom:14}}>
          <Sel label="Period" value={period} onChange={v=>setPeriod(+v)} options={PERIODS.map((p,i)=>({value:i,label:p.label}))}/>
        </div>
        <button onClick={run} disabled={status==="loading"||!totalCombos} style={{
          background:status==="loading"||!totalCombos?C.dim:C.accent,color:C.bg,border:"none",
          borderRadius:8,padding:"12px 20px",fontSize:13,fontWeight:800,
          cursor:status==="loading"||!totalCombos?"not-allowed":"pointer",letterSpacing:"0.08em",width:"100%"
        }}>{status==="loading"?`⟳ ${progress}/${total} running...`:`▶ RUN MATRIX (${totalCombos} combos)`}</button>
        {status==="loading" && <ProgressBar value={progress} total={total}/>}
        {error && <div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {error}</div>}
      </div>

      {sorted.length>0 && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <span style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>{sorted.length} combinations</span>
            {sorted[0] && <span style={{fontSize:10,color:C.accent}}>
              Best: {sorted[0].symbol.replace("/USDT","")} {sorted[0].timeframe?.toUpperCase()} N={sorted[0].pivot_n} {sorted[0].rr}R [{sorted[0].engine||"—"}] [{sorted[0].entry_mode||"—"}]
            </span>}
            <button onClick={exportCSV} style={{marginLeft:"auto",padding:"4px 12px",background:"transparent",border:`1px solid ${C.accent}`,borderRadius:6,color:C.accent,fontSize:10,cursor:"pointer"}}>⬇ Export CSV</button>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:C.bg}}>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Pair</th>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>TF</th>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>N</th>
                <th style={{padding:"8px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>RR</th>
                <th style={{padding:"8px 10px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Engine</th>
                <th style={{padding:"8px 10px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Entry</th>
                <SortTh k="total_return"  label="Return %"/>
                <SortTh k="cagr"          label="CAGR %"/>
                <SortTh k="max_drawdown"  label="Max DD %"/>
                <SortTh k="sharpe"        label="Sharpe"/>
                <SortTh k="profit_factor" label="PF"/>
                <SortTh k="win_rate"      label="WR %"/>
                <SortTh k="total_trades"  label="Trades"/>
              </tr></thead>
              <tbody>
                {sorted.map((r,i)=>{
                  const s=r.stats, isTop=i===0, g=s.total_return>=0;
                  return (
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:isTop?C.accentDim:"transparent"}}>
                      <td style={{padding:"6px 10px",fontWeight:isTop?700:400,color:isTop?C.accent:C.text}}>{r.symbol.replace("/USDT","")}</td>
                      <td style={{padding:"6px 10px",color:C.muted}}>{r.timeframe?.toUpperCase()}</td>
                      <td style={{padding:"6px 10px",color:C.muted}}>{r.pivot_n}</td>
                      <td style={{padding:"6px 10px",color:C.gold}}>{r.rr}R</td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{background:C.accentDim,color:C.accent,padding:"2px 6px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.engine||"—"}</span>
                      </td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{background:C.blueDim,color:C.blue,padding:"2px 6px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.entry_mode||"—"}</span>
                      </td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:g?C.accent:C.red,fontWeight:700}}>{g?"+":""}{fmt(s.total_return)}%</td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:C.gold}}>{fmt(s.cagr)}%</td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:C.red}}>-{fmt(s.max_drawdown)}%</td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:s.sharpe>=1?C.accent:C.muted}}>{fmt(s.sharpe)}</td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:s.profit_factor>=1.5?C.accent:C.red}}>{fmt(s.profit_factor)}</td>
                      <td style={{padding:"6px 10px",textAlign:"right"}}>{fmt(s.win_rate)}%</td>
                      <td style={{padding:"6px 10px",textAlign:"right",color:C.muted}}>{s.total_trades}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {status==="idle" && <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>Select variables and hit <span style={{color:C.accent}}>▶ RUN MATRIX</span></div>}
    </div>
  );
}

// ── COMPARE TAB ────────────────────────────────────────────────
function CompareTab() {
  const [selPairs,      setSelPairs]      = useState(["XRP/USDT","DOGE/USDT","ADA/USDT"]);
  const [selTfs,        setSelTfs]        = useState(["1m"]);
  const [selRisks,      setSelRisks]      = useState(["fixed"]);
  const [selPivots,     setSelPivots]     = useState([8]);
  const [selRR,         setSelRR]         = useState([2]);
  const [selFibs,       setSelFibs]       = useState([0.618]);
  const [selEngines,    setSelEngines]    = useState(["original"]);
  const [selEntryModes, setSelEntryModes] = useState(["touch"]);
  const [periodA,       setPeriodA]       = useState({label:"2025 Full",start:"2025-01-01",end:"2026-01-01"});
  const [periodB,       setPeriodB]       = useState({label:"2026 YTD", start:"2026-01-01",end:"now"});
  const [status,        setStatus]        = useState("idle");
  const [results,       setResults]       = useState([]);
  const [sortKey,       setSortKey]       = useState("consistency_score");
  const [sortDir,       setSortDir]       = useState("desc");
  const [filter,        setFilter]        = useState("all");
  const [error,         setError]         = useState("");

  const PERIOD_PRESETS = [
    {label:"Last 30 Days", start:null, end:"now", days:30},
    {label:"Last 90 Days", start:null, end:"now", days:90},
    {label:"2025 Full",    start:"2025-01-01", end:"2026-01-01"},
    {label:"2026 YTD",     start:"2026-01-01", end:"now"},
  ];

  const tog = (arr,setArr,val) => setArr(toggle(arr,val));
  const totalCombos = selPairs.length*selTfs.length*selRisks.length*selPivots.length*selRR.length*selFibs.length*selEngines.length*selEntryModes.length;

  const getStart = (p) => {
    if (p.start) return p.start;
    const d = new Date(Date.now() - p.days*86400000);
    return d.toISOString().split("T")[0];
  };

  const run = useCallback(async () => {
    if (!totalCombos) return;
    setStatus("loading"); setResults([]); setError("");
    try {
      const res = await fetch(`${API}/compare`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          symbols:selPairs, timeframes:selTfs, pivot_ns:selPivots,
          risk_methods:selRisks, rr_ratios:selRR, fib_levels:selFibs,
          engines:selEngines, entry_modes:selEntryModes,
          period_a_start:getStart(periodA), period_a_end:periodA.end,
          period_b_start:getStart(periodB), period_b_end:periodB.end,
        })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error||"Compare failed");
      setResults(data.results); setStatus("done");
    } catch(e) { setError(e.message); setStatus("error"); }
  }, [selPairs,selTfs,selRisks,selPivots,selRR,selFibs,selEngines,selEntryModes,periodA,periodB,totalCombos]);

  const filtered = useMemo(() => {
    let r = [...results];
    if (filter==="both_positive") r = r.filter(x=>x.both_positive);
    if (filter==="top20") r = r.slice(0,20);
    return [...r].sort((a,b)=>{
      const va=a[sortKey]??0, vb=b[sortKey]??0;
      return sortDir==="desc"?vb-va:va-vb;
    });
  }, [results,filter,sortKey,sortDir]);

  const handleSort = (k) => { if(sortKey===k) setSortDir(d=>d==="desc"?"asc":"desc"); else { setSortKey(k); setSortDir("desc"); } };
  const SortTh = ({k,label}) => (
    <th className="sortable" onClick={()=>handleSort(k)} style={{padding:"8px 8px",color:sortKey===k?C.gold:C.muted,textAlign:"right",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>
      {label}{sortKey===k?(sortDir==="desc"?" ↓":" ↑"):""}
    </th>
  );

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        {/* Period pickers */}
        <div style={{marginBottom:14}}>
          <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>Periods A vs B</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:9,color:C.accent,marginBottom:6}}>PERIOD A</div>
              {PERIOD_PRESETS.map(p=>(
                <div key={p.label} onClick={()=>setPeriodA(p)} style={{
                  background:periodA.label===p.label?C.accentDim:C.card,
                  border:`1px solid ${periodA.label===p.label?C.accent:C.border}`,
                  borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:11,
                  color:periodA.label===p.label?C.accent:C.muted,marginBottom:4
                }}>{p.label}</div>
              ))}
            </div>
            <div>
              <div style={{fontSize:9,color:C.gold,marginBottom:6}}>PERIOD B</div>
              {PERIOD_PRESETS.map(p=>(
                <div key={p.label} onClick={()=>setPeriodB(p)} style={{
                  background:periodB.label===p.label?C.goldDim:C.card,
                  border:`1px solid ${periodB.label===p.label?C.gold:C.border}`,
                  borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:11,
                  color:periodB.label===p.label?C.gold:C.muted,marginBottom:4
                }}>{p.label}</div>
              ))}
            </div>
          </div>
        </div>

        {[
          ["Pairs",       ALL_PAIRS,    selPairs,      setSelPairs,      p=>p.replace("/USDT","")],
          ["Timeframes",  ALL_TIMEFRAMES,selTfs,       setSelTfs,        t=>t.toUpperCase()],
          ["Risk Methods",ALL_RISKS,    selRisks,      setSelRisks,      fmtRisk],
          ["Pivot N",     ALL_PIVOTS,   selPivots,     setSelPivots,     n=>`N=${n}`],
          ["Risk:Reward", ALL_RR,       selRR,         setSelRR,         r=>`${r}R`],
          ["Fib Level",   ALL_FIBS,     selFibs,       setSelFibs,       f=>`${f}`],
          ["Engine",      ALL_ENGINES,  selEngines,    setSelEngines,    e=>e],
          ["Entry Mode",  ALL_ENTRY,    selEntryModes, setSelEntryModes, e=>e],
        ].map(([label,all,sel,setSel,fmt])=>(
          <div key={label} style={{marginBottom:14}}>
            <span style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}}>{label}</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {all.map(v=><Toggle key={v} label={fmt(v)} value={sel.includes(v)} onChange={()=>tog(sel,setSel,v)}/>)}
            </div>
          </div>
        ))}

        <button onClick={run} disabled={status==="loading"||!totalCombos} style={{
          background:status==="loading"||!totalCombos?C.dim:C.gold,color:C.bg,border:"none",
          borderRadius:8,padding:"12px 20px",fontSize:13,fontWeight:800,
          cursor:status==="loading"||!totalCombos?"not-allowed":"pointer",letterSpacing:"0.08em",width:"100%"
        }}>{status==="loading"?"⟳ COMPARING...":`⚖ COMPARE ${totalCombos} COMBOS × 2 PERIODS`}</button>
        {error && <div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {error}</div>}
      </div>

      {results.length>0 && (
        <div>
          {filtered[0] && (
            <div style={{background:C.goldDim,border:`1px solid ${C.gold}`,borderRadius:12,padding:"14px 18px",marginBottom:16}}>
              <div style={{fontSize:10,color:C.gold,letterSpacing:"0.1em",marginBottom:6}}>⭐ MOST CONSISTENT</div>
              <div style={{fontSize:18,fontWeight:800,color:C.text}}>
                {filtered[0].symbol.replace("/USDT","")} {filtered[0].timeframe?.toUpperCase()} · N={filtered[0].pivot_n} · {filtered[0].rr}R · [{filtered[0].engine}]
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:4}}>
                {periodA.label}: <span style={{color:filtered[0].period_a_return>=0?C.accent:C.red,fontWeight:700}}>{filtered[0].period_a_return>=0?"+":""}{fmt(filtered[0].period_a_return)}%</span>
                {" · "}
                {periodB.label}: <span style={{color:filtered[0].period_b_return>=0?C.gold:C.red,fontWeight:700}}>{filtered[0].period_b_return>=0?"+":""}{fmt(filtered[0].period_b_return)}%</span>
                {" · "}Score: <span style={{color:C.gold,fontWeight:700}}>{fmt(filtered[0].consistency_score)}</span>
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            {[["all","All"],["both_positive","Both Positive"],["top20","Top 20"]].map(([v,l])=>(
              <div key={v} onClick={()=>setFilter(v)} style={{
                background:filter===v?C.goldDim:C.card,border:`1px solid ${filter===v?C.gold:C.border}`,
                borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:10,
                color:filter===v?C.gold:C.muted
              }}>{l}</div>
            ))}
            <div style={{marginLeft:"auto",fontSize:10,color:C.muted,alignSelf:"center"}}>{filtered.length} results</div>
          </div>

          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Pair</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>TF</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>N</th>
                  <th style={{padding:"8px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>RR</th>
                  <th style={{padding:"8px 8px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Engine</th>
                  <th style={{padding:"8px 8px",color:C.accent,textAlign:"left",fontWeight:400,whiteSpace:"nowrap",fontSize:9}}>Entry</th>
                  <SortTh k="period_a_return"    label={`${periodA.label} %`}/>
                  <SortTh k="period_b_return"    label={`${periodB.label} %`}/>
                  <SortTh k="avg_return"         label="Avg Ret"/>
                  <SortTh k="avg_dd"             label="Avg DD"/>
                  <SortTh k="avg_sharpe"         label="Sharpe"/>
                  <SortTh k="consistency_score"  label="Score ⭐"/>
                </tr></thead>
                <tbody>
                  {filtered.map((r,i)=>{
                    const isTop=i===0, bothPos=r.both_positive;
                    const rowBg=isTop?C.goldDim:bothPos?"#00ff9d08":"transparent";
                    return (
                      <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:rowBg}}>
                        <td style={{padding:"6px 8px",fontWeight:isTop?700:400,color:isTop?C.gold:C.text}}>{r.symbol.replace("/USDT","")}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{r.timeframe?.toUpperCase()}</td>
                        <td style={{padding:"6px 8px",color:C.muted}}>{r.pivot_n}</td>
                        <td style={{padding:"6px 8px",color:C.gold}}>{r.rr}R</td>
                        <td style={{padding:"6px 8px"}}>
                          <span style={{background:C.accentDim,color:C.accent,padding:"2px 5px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.engine||"—"}</span>
                        </td>
                        <td style={{padding:"6px 8px"}}>
                          <span style={{background:C.blueDim,color:C.blue,padding:"2px 5px",borderRadius:3,fontSize:8,fontWeight:700}}>{r.entry_mode||"—"}</span>
                        </td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_a_return>=0?C.accent:C.red,fontWeight:700}}>{r.period_a_return>=0?"+":""}{fmt(r.period_a_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.period_b_return>=0?C.gold:C.red,fontWeight:700}}>{r.period_b_return>=0?"+":""}{fmt(r.period_b_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_return>=0?C.accent:C.red}}>{r.avg_return>=0?"+":""}{fmt(r.avg_return)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.red}}>-{fmt(r.avg_dd)}%</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:r.avg_sharpe>=1?C.accent:C.muted}}>{fmt(r.avg_sharpe)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.gold,fontWeight:isTop?700:400}}>{fmt(r.consistency_score)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
      {status==="idle" && <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>Select periods and variables, then hit <span style={{color:C.gold}}>⚖ COMPARE</span></div>}
    </div>
  );
}

// ── PREFETCH TAB ───────────────────────────────────────────────
function PrefetchTab() {
  const [symbol,    setSymbol]    = useState("XRP/USDT");
  const [tf,        setTf]        = useState("1m");
  const [startDate, setStartDate] = useState("2025-01-01");
  const [endDate,   setEndDate]   = useState("now");
  const [status,    setStatus]    = useState(null);
  const [polling,   setPolling]   = useState(false);
  const [jobStatus, setJobStatus] = useState(null);

  const prefetch = async () => {
    setStatus("queuing"); setJobStatus(null);
    try {
      const res  = await fetch(`${API}/prefetch`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol,timeframe:tf,start_date:startDate,end_date:endDate})});
      const data = await res.json();
      setStatus(data.status);
      setPolling(true);
    } catch(e) { setStatus("error"); }
  };

  useEffect(() => {
    if (!polling) return;
    const interval = setInterval(async () => {
      try {
        const res  = await fetch(`${API}/prefetch-status?symbol=${encodeURIComponent(symbol)}&timeframe=${tf}&start_date=${startDate}&end_date=${endDate}`);
        const data = await res.json();
        setJobStatus(data);
        if (data.job_status === "done" || data.job_status === "error") setPolling(false);
      } catch(e) {}
    }, 3000);
    return () => clearInterval(interval);
  }, [polling, symbol, tf, startDate, endDate]);

  const pct = jobStatus?.completeness_pct || 0;
  const ready = jobStatus?.ready;

  return (
    <div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
        <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:14}}>
          Pre-load candle data into Supabase cache
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Sel label="Pair"      value={symbol} onChange={setSymbol} options={ALL_PAIRS.map(p=>({value:p,label:p}))}/>
          <Sel label="Timeframe" value={tf}     onChange={setTf}     options={ALL_TIMEFRAMES.map(t=>({value:t,label:t.toUpperCase()}))}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:9,color:C.muted,marginBottom:4}}>START DATE</div>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={{
              width:"100%",background:C.card,color:C.text,border:`1px solid ${C.border}`,
              borderRadius:6,padding:"8px 10px",fontSize:12,outline:"none",fontFamily:"inherit"
            }}/>
          </div>
          <div>
            <div style={{fontSize:9,color:C.muted,marginBottom:4}}>END DATE</div>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={{
              width:"100%",background:C.card,color:C.text,border:`1px solid ${C.border}`,
              borderRadius:6,padding:"8px 10px",fontSize:12,outline:"none",fontFamily:"inherit"
            }}/>
          </div>
        </div>
        <button onClick={prefetch} disabled={polling} style={{
          background:polling?C.dim:C.gold,color:C.bg,border:"none",borderRadius:8,
          padding:12,fontSize:13,fontWeight:800,cursor:polling?"not-allowed":"pointer",
          letterSpacing:"0.08em",width:"100%"
        }}>{polling?"⟳ FETCHING...":"⬇ PREFETCH CANDLES"}</button>
      </div>

      {jobStatus && (
        <div style={{background:C.surface,border:`1px solid ${ready?C.accent:C.border}`,borderRadius:12,padding:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>
              {symbol} {tf.toUpperCase()} · {startDate} → {endDate}
            </span>
            <span style={{fontSize:10,fontWeight:700,color:ready?C.accent:C.gold}}>
              {ready?"✓ READY":"⟳ LOADING"}
            </span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <StatCard label="DB Candles"   value={jobStatus.db_candles?.toLocaleString()||"—"}/>
            <StatCard label="Expected"     value={jobStatus.expected?.toLocaleString()||"—"}/>
            <StatCard label="Completeness" value={`${pct}%`} color={ready?C.accent:C.gold}/>
          </div>
          <div style={{background:C.dim,borderRadius:4,height:6}}>
            <div style={{background:ready?C.accent:C.gold,height:6,borderRadius:4,width:`${Math.min(pct,100)}%`,transition:"width 0.5s"}}/>
          </div>
          {jobStatus.error && <div style={{color:C.red,fontSize:11,marginTop:8}}>✗ {jobStatus.error}</div>}
        </div>
      )}
    </div>
  );
}

// ── JOURNAL TAB (Paper) ────────────────────────────────────────
function JournalTab() {
  const [account,      setAccount]      = useState(null);
  const [trades,       setTrades]       = useState([]);
  const [loading,      setLoading]      = useState(true);
  const [error,        setError]        = useState("");
  const [filterPair,   setFilterPair]   = useState("all");
  const [filterTF,     setFilterTF]     = useState("all");
  const [filterLabel,  setFilterLabel]  = useState("all");
  const [filterResult, setFilterResult] = useState("all");
  const [tab,          setTab]          = useState("overview");

  const load = useCallback(async () => {
    setLoading(true); setError("");
    try {
      const res  = await fetch(`${API}/journal`);
      const data = await res.json();
      if (data.success) {
        setAccount(data.account||null);
        setTrades(Array.isArray(data.trades)?data.trades:[]);
      } else throw new Error(data.error||"Failed");
    } catch(e) { setError(e.message); }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, []);

  const pairs  = useMemo(() => ["all",...new Set(trades.map(t=>t.symbol))],  [trades]);
  const tfs    = useMemo(() => ["all",...new Set(trades.map(t=>t.timeframe))],[trades]);
  const labels = useMemo(() => ["all",...new Set(trades.map(t=>t.label).filter(Boolean))],[trades]);

  const filtered = useMemo(() => trades.filter(t=>{
    if (filterPair!=="all"   && t.symbol!==filterPair)      return false;
    if (filterTF!=="all"     && t.timeframe!==filterTF)     return false;
    if (filterLabel!=="all"  && t.label!==filterLabel)      return false;
    if (filterResult==="win" && !t.won)                     return false;
    if (filterResult==="loss"&& t.won)                      return false;
    return true;
  }), [trades,filterPair,filterTF,filterLabel,filterResult]);

  const stats = useMemo(() => {
    if (!filtered.length) return null;
    const wins=filtered.filter(t=>t.won), losses=filtered.filter(t=>!t.won);
    const totalPnl=filtered.reduce((a,t)=>a+(t.pnl||0),0);
    const wr=wins.length/filtered.length*100;
    const avgWin=wins.length?wins.reduce((a,t)=>a+(t.pnl||0),0)/wins.length:0;
    const avgLoss=losses.length?Math.abs(losses.reduce((a,t)=>a+(t.pnl||0),0)/losses.length):0;
    const pf=avgLoss>0?avgWin/avgLoss:999;
    let maxCW=0,maxCL=0,cw=0,cl=0;
    [...filtered].reverse().forEach(t=>{if(t.won){cw++;cl=0;maxCW=Math.max(maxCW,cw);}else{cl++;cw=0;maxCL=Math.max(maxCL,cl);}});
    return {wins:wins.length,losses:losses.length,total:filtered.length,totalPnl,wr,avgWin,avgLoss,pf,maxCW,maxCL};
  }, [filtered]);

  const equityCurve = useMemo(() => {
    let eq = 100;
    return [...filtered].reverse().map(t=>{eq+=t.pnl||0;return{t:t.created_at,eq:Math.round(eq*100)/100};});
  }, [filtered]);

  const pnlByPair = useMemo(() => {
    const map={};
    filtered.forEach(t=>{if(!map[t.symbol])map[t.symbol]=0;map[t.symbol]+=(t.pnl||0);});
    return Object.entries(map).map(([name,value])=>({name:name.replace("/USDT",""),value:Math.round(value*100)/100}));
  }, [filtered]);

  const acc = account;
  const totalReturn = acc ? Math.round(((acc.balance-100)/100*100)*100)/100 : 0;
  const green = totalReturn >= 0;
  const col   = green ? C.accent : C.red;
  const sel2  = {background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,cursor:"pointer",outline:"none"};

  if (loading) return <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>⟳ Loading journal...</div>;
  if (error)   return <div style={{color:C.red,fontSize:12,padding:"20px",background:C.redDim,border:`1px solid ${C.red}`,borderRadius:8}}>✗ {error}</div>;

  return (
    <div>
      {/* Account banner */}
      {acc ? (
        <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em"}}>PAPER BALANCE</div>
            <div style={{fontSize:34,fontWeight:800,color:col,lineHeight:1}}>${fmt(acc.balance)}</div>
          </div>
          <div style={{flex:1,minWidth:180}}>
            <div style={{fontSize:13,marginBottom:4}}>Return: <strong style={{color:col}}>{green?"+":""}{fmt(totalReturn)}%</strong></div>
            <div style={{fontSize:11,color:C.muted}}>{acc.total_trades} trades · {acc.wins}W / {acc.losses}L · Max DD -{fmt(acc.max_drawdown||0)}%</div>
          </div>
          <button onClick={load} style={{background:C.card,color:C.accent,border:`1px solid ${C.accent}`,borderRadius:8,padding:"8px 14px",fontSize:10,cursor:"pointer"}}>↻ Refresh</button>
        </div>
      ) : (
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No paper trades yet — waiting for first signal 🤖</div>
      )}

      {/* Filters */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>Filter Trades</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            ["Pair",     filterPair,   setFilterPair,   pairs,  p=>p==="all"?"All Pairs":p],
            ["TF",       filterTF,     setFilterTF,     tfs,    t=>t==="all"?"All TF":t.toUpperCase()],
            ["Strategy", filterLabel,  setFilterLabel,  labels, l=>l==="all"?"All":l],
            ["Result",   filterResult, setFilterResult, ["all","win","loss"], r=>r==="all"?"All":r==="win"?"Wins":"Losses"],
          ].map(([label,val,setVal,opts,fmtOpt])=>(
            <div key={label} style={{display:"flex",flexDirection:"column",gap:3}}>
              <span style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{label}</span>
              <select value={val} onChange={e=>setVal(e.target.value)} style={sel2}>
                {opts.map(o=><option key={o} value={o}>{fmtOpt(o)}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:0,marginBottom:16,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {[["overview","Overview"],["chart","Equity"],["breakdown","By Pair"],["trades","Trade Log"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            flex:1,padding:"10px 4px",background:tab===id?C.card:"transparent",
            color:tab===id?C.accent:C.muted,border:"none",
            borderBottom:tab===id?`2px solid ${C.accent}`:"2px solid transparent",
            fontSize:9,cursor:"pointer",letterSpacing:"0.06em",textTransform:"uppercase"
          }}>{label}</button>
        ))}
      </div>

      {tab==="overview" && (
        <div>
          {!stats ? (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
              <StatCard label="Total Trades"  value={stats.total}/>
              <StatCard label="Win Rate"      value={`${fmt(stats.wr)}%`}  color={stats.wr>=50?C.accent:C.red} sub={`${stats.wins}W / ${stats.losses}L`}/>
              <StatCard label="Total P&L"     value={`${stats.totalPnl>=0?"+":""}$${fmt(stats.totalPnl)}`} color={stats.totalPnl>=0?C.accent:C.red}/>
              <StatCard label="Profit Factor" value={fmt(stats.pf)}        color={stats.pf>=1.5?C.accent:C.red}/>
              <StatCard label="Avg Win $"     value={`$${fmt(stats.avgWin)}`}  color={C.accent}/>
              <StatCard label="Avg Loss $"    value={`$${fmt(stats.avgLoss)}`} color={C.red}/>
              <StatCard label="Max Consec W"  value={stats.maxCW} color={C.accent}/>
              <StatCard label="Max Consec L"  value={stats.maxCL} color={C.red}/>
            </div>
          )}
        </div>
      )}

      {tab==="chart" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Equity Curve · $100 Start</div>
          {equityCurve.length>1 ? (
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={equityCurve} margin={{top:4,right:4,left:0,bottom:0}}>
                <defs><linearGradient id="jgrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%"  stopColor={C.accent} stopOpacity={0.3}/>
                  <stop offset="95%" stopColor={C.accent} stopOpacity={0}/>
                </linearGradient></defs>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                <XAxis dataKey="t" tickFormatter={t=>new Date(t).toLocaleDateString("en-MY",{month:"short",day:"numeric"})} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={44}/>
                <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                <ReferenceLine y={100} stroke={C.muted} strokeDasharray="4 4"/>
                <Area type="monotone" dataKey="eq" stroke={C.accent} strokeWidth={2} fill="url(#jgrad)" dot={false}/>
              </AreaChart>
            </ResponsiveContainer>
          ) : (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>Not enough trades yet</div>
          )}
        </div>
      )}

      {tab==="breakdown" && (
        <div>
          {pnlByPair.length>0 && (
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>P&L by Pair</div>
              <ResponsiveContainer width="100%" height={180}>
                <BarChart data={pnlByPair} margin={{top:4,right:4,left:0,bottom:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                  <XAxis dataKey="name" tick={{fill:C.muted,fontSize:10}} tickLine={false} axisLine={false}/>
                  <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} width={44}/>
                  <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                  <ReferenceLine y={0} stroke={C.muted}/>
                  <Bar dataKey="value" radius={[3,3,0,0]} fill={C.accent}/>
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}
          {filtered.length>0 && (
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:16}}>
              <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>Stats by Pair + Strategy</div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead><tr style={{background:C.bg}}>
                    {["Pair","TF","Strategy","Trades","WR %","P&L","Avg Win","Avg Loss"].map(h=>(
                      <th key={h} style={{padding:"7px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {(()=>{
                      const groups={};
                      filtered.forEach(t=>{const k=`${t.symbol}|${t.timeframe}|${t.label||"-"}`;if(!groups[k])groups[k]=[];groups[k].push(t);});
                      return Object.entries(groups).map(([k,ts])=>{
                        const [sym,tf,lbl]=k.split("|");
                        const w=ts.filter(t=>t.won),l=ts.filter(t=>!t.won);
                        const pnl=ts.reduce((a,t)=>a+(t.pnl||0),0);
                        const aw=w.length?w.reduce((a,t)=>a+(t.pnl||0),0)/w.length:0;
                        const al=l.length?Math.abs(l.reduce((a,t)=>a+(t.pnl||0),0)/l.length):0;
                        const wr=w.length/ts.length*100;
                        return (
                          <tr key={k} style={{borderTop:`1px solid ${C.border}`}}>
                            <td style={{padding:"6px 10px",fontWeight:700}}>{sym.replace("/USDT","")}</td>
                            <td style={{padding:"6px 10px",color:C.muted}}>{tf.toUpperCase()}</td>
                            <td style={{padding:"6px 10px",color:C.gold,fontSize:9}}>{lbl}</td>
                            <td style={{padding:"6px 10px"}}>{ts.length} ({w.length}W/{l.length}L)</td>
                            <td style={{padding:"6px 10px",color:wr>=50?C.accent:C.red}}>{fmt(wr)}%</td>
                            <td style={{padding:"6px 10px",color:pnl>=0?C.accent:C.red}}>{pnl>=0?"+":""}${fmt(pnl)}</td>
                            <td style={{padding:"6px 10px",color:C.accent}}>${fmt(aw)}</td>
                            <td style={{padding:"6px 10px",color:C.red}}>${fmt(al)}</td>
                          </tr>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {tab==="trades" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>
            Trade Log · {filtered.length} trades
          </div>
          {filtered.length===0 ? (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>
          ) : (
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  {["Date","Pair","TF","Dir","Entry","Exit","RR","P&L","Balance","Strategy"].map(h=>(
                    <th key={h} style={{padding:"7px 10px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {filtered.map((t,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:t.won?"#00ff9d05":"#ff446605"}}>
                      <td style={{padding:"6px 10px",color:C.muted,whiteSpace:"nowrap"}}>{fmtDT(t.created_at)}</td>
                      <td style={{padding:"6px 10px",fontWeight:700}}>{(t.symbol||"").replace("/USDT","")}</td>
                      <td style={{padding:"6px 10px",color:C.muted}}>{(t.timeframe||"").toUpperCase()}</td>
                      <td style={{padding:"6px 10px"}}>
                        <span style={{background:t.direction==="LONG"?C.accentDim:C.redDim,color:t.direction==="LONG"?C.accent:C.red,padding:"2px 6px",borderRadius:3,fontSize:9,fontWeight:700}}>{t.direction}</span>
                      </td>
                      <td style={{padding:"6px 10px"}}>{fmt(t.entry,4)}</td>
                      <td style={{padding:"6px 10px"}}>{fmt(t.exit_price,4)}</td>
                      <td style={{padding:"6px 10px",color:C.gold}}>{t.rr}R</td>
                      <td style={{padding:"6px 10px",color:t.pnl>=0?C.accent:C.red,fontWeight:700}}>{t.pnl>=0?"+":""}${fmt(t.pnl)}</td>
                      <td style={{padding:"6px 10px"}}>${fmt(t.balance)}</td>
                      <td style={{padding:"6px 10px",color:C.gold,fontSize:9}}>{t.label||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── LIVE JOURNAL TAB ───────────────────────────────────────────
function LiveJournalTab() {
  const [account,      setAccount]      = useState(null);
  const [trades,       setTrades]       = useState([]);
  const [loading,      setLoading]      = useState(true);
  const [error,        setError]        = useState("");
  const [filterPair,   setFilterPair]   = useState("all");
  const [filterResult, setFilterResult] = useState("all");
  const [tab,          setTab]          = useState("overview");

  const load = useCallback(async () => {
    setLoading(true); setError("");
    try {
      const res  = await fetch(`${API}/live-journal`);
      const data = await res.json();
      if (data.success) {
        setAccount(data.account||null);
        setTrades(Array.isArray(data.trades)?data.trades:[]);
      } else throw new Error(data.error||"Failed");
    } catch(e) { setError(e.message); }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, []);

  const pairs = useMemo(() => ["all",...new Set(trades.map(t=>t.symbol))], [trades]);

  const filtered = useMemo(() => trades.filter(t=>{
    if (filterPair!=="all"   && t.symbol!==filterPair) return false;
    if (filterResult==="win" && !t.won)                return false;
    if (filterResult==="loss"&& t.won)                 return false;
    return true;
  }), [trades,filterPair,filterResult]);

  const stats = useMemo(() => {
    if (!filtered.length) return null;
    const wins=filtered.filter(t=>t.won), losses=filtered.filter(t=>!t.won);
    const totalPnl=filtered.reduce((a,t)=>a+(t.pnl||0),0);
    const wr=wins.length/filtered.length*100;
    const avgWin=wins.length?wins.reduce((a,t)=>a+(t.pnl||0),0)/wins.length:0;
    const avgLoss=losses.length?Math.abs(losses.reduce((a,t)=>a+(t.pnl||0),0)/losses.length):0;
    const pf=avgLoss>0?avgWin/avgLoss:999;
    let maxCW=0,maxCL=0,cw=0,cl=0;
    [...filtered].reverse().forEach(t=>{if(t.won){cw++;cl=0;maxCW=Math.max(maxCW,cw);}else{cl++;cw=0;maxCL=Math.max(maxCL,cl);}});
    return {wins:wins.length,losses:losses.length,total:filtered.length,totalPnl,wr,avgWin,avgLoss,pf,maxCW,maxCL};
  }, [filtered]);

  const equityCurve = useMemo(() => {
    if (!account) return [];
    let eq = account.start_balance || 100;
    return [...filtered].reverse().map(t=>{eq+=t.pnl||0;return{t:t.created_at,eq:Math.round(eq*100)/100};});
  }, [filtered,account]);

  const pnlByPair = useMemo(() => {
    const map={};
    filtered.forEach(t=>{if(!map[t.symbol])map[t.symbol]=0;map[t.symbol]+=(t.pnl||0);});
    return Object.entries(map).map(([name,value])=>({name:name.replace("/USDT",""),value:Math.round(value*100)/100}));
  }, [filtered]);

  const startBal    = account?.start_balance || 100;
  const totalReturn = account ? Math.round(((account.balance-startBal)/startBal*100)*100)/100 : 0;
  const green = totalReturn >= 0;
  const col   = green ? C.accent : C.red;
  const sel2  = {background:C.card,color:C.text,border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11,cursor:"pointer",outline:"none"};

  if (loading) return <div style={{textAlign:"center",padding:"60px 0",color:C.muted,fontSize:12}}>⟳ Loading live journal...</div>;
  if (error)   return <div style={{color:C.red,fontSize:12,padding:"20px",background:C.redDim,border:`1px solid ${C.red}`,borderRadius:8}}>✗ {error}</div>;

  return (
    <div>
      {/* Live badge */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:C.red,boxShadow:`0 0 8px ${C.red}`}}/>
        <span style={{fontSize:10,color:C.red,letterSpacing:"0.2em",textTransform:"uppercase",fontWeight:700}}>Live Trading Account</span>
      </div>

      {/* Account banner */}
      {account ? (
        <div style={{background:green?C.accentDim:C.redDim,border:`1px solid ${col}`,borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em"}}>LIVE BALANCE</div>
            <div style={{fontSize:34,fontWeight:800,color:col,lineHeight:1}}>${fmt(account.balance)}</div>
          </div>
          <div style={{flex:1,minWidth:180}}>
            <div style={{fontSize:13,marginBottom:4}}>Return: <strong style={{color:col}}>{green?"+":""}{fmt(totalReturn)}%</strong></div>
            <div style={{fontSize:11,color:C.muted}}>{account.total_trades||0} trades · {account.wins||0}W / {account.losses||0}L · Max DD -{fmt(account.max_drawdown||0)}%</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>Started: ${fmt(startBal)}</div>
          </div>
          <button onClick={load} style={{background:C.card,color:C.red,border:`1px solid ${C.red}`,borderRadius:8,padding:"8px 14px",fontSize:10,cursor:"pointer"}}>↻ Refresh</button>
        </div>
      ) : (
        <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No live trades yet — bot not started 🤖</div>
      )}

      {/* Filters */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10}}>Filter Trades</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            ["Pair",   filterPair,   setFilterPair,   pairs,              p=>p==="all"?"All Pairs":p],
            ["Result", filterResult, setFilterResult, ["all","win","loss"],r=>r==="all"?"All":r==="win"?"Wins":"Losses"],
          ].map(([label,val,setVal,opts,fmtOpt])=>(
            <div key={label} style={{display:"flex",flexDirection:"column",gap:3}}>
              <span style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{label}</span>
              <select value={val} onChange={e=>setVal(e.target.value)} style={sel2}>
                {opts.map(o=><option key={o} value={o}>{fmtOpt(o)}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:0,marginBottom:16,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {[["overview","Overview"],["chart","Equity"],["breakdown","By Pair"],["trades","Trade Log"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            flex:1,padding:"10px 4px",background:tab===id?C.card:"transparent",
            color:tab===id?C.red:C.muted,border:"none",
            borderBottom:tab===id?`2px solid ${C.red}`:"2px solid transparent",
            fontSize:9,cursor:"pointer",letterSpacing:"0.06em",textTransform:"uppercase"
          }}>{label}</button>
        ))}
      </div>

      {tab==="overview" && (
        <div>
          {!stats ? (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades match filters</div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8,marginBottom:16}}>
              <StatCard label="Total Trades"  value={stats.total}/>
              <StatCard label="Win Rate"      value={`${fmt(stats.wr)}%`}  color={stats.wr>=50?C.accent:C.red} sub={`${stats.wins}W / ${stats.losses}L`}/>
              <StatCard label="Total P&L"     value={`${stats.totalPnl>=0?"+":""}$${fmt(stats.totalPnl)}`} color={stats.totalPnl>=0?C.accent:C.red}/>
              <StatCard label="Profit Factor" value={fmt(stats.pf)}        color={stats.pf>=1.5?C.accent:C.red}/>
              <StatCard label="Avg Win $"     value={`$${fmt(stats.avgWin)}`}  color={C.accent}/>
              <StatCard label="Avg Loss $"    value={`$${fmt(stats.avgLoss)}`} color={C.red}/>
              <StatCard label="Max Consec W"  value={stats.maxCW} color={C.accent}/>
              <StatCard label="Max Consec L"  value={stats.maxCL} color={C.red}/>
            </div>
          )}
        </div>
      )}

      {tab==="chart" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>Live Equity Curve</div>
          {equityCurve.length>1 ? (
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={equityCurve} margin={{top:4,right:4,left:0,bottom:0}}>
                <defs><linearGradient id="lgrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%"  stopColor={col} stopOpacity={0.3}/>
                  <stop offset="95%" stopColor={col} stopOpacity={0}/>
                </linearGradient></defs>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                <XAxis dataKey="t" tickFormatter={t=>new Date(t).toLocaleDateString("en-MY",{month:"short",day:"numeric"})} tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} interval="preserveStartEnd"/>
                <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} domain={["auto","auto"]} width={48}/>
                <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                <ReferenceLine y={startBal} stroke={C.muted} strokeDasharray="4 4"/>
                <Area type="monotone" dataKey="eq" stroke={col} strokeWidth={2} fill="url(#lgrad)" dot={false}/>
              </AreaChart>
            </ResponsiveContainer>
          ) : (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>Not enough trades yet</div>
          )}
        </div>
      )}

      {tab==="breakdown" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>P&L by Pair</div>
          {pnlByPair.length ? (
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={pnlByPair} margin={{top:4,right:4,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
                <XAxis dataKey="name" tick={{fill:C.muted,fontSize:10}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:C.muted,fontSize:9}} tickLine={false} axisLine={false} tickFormatter={v=>`$${v}`} width={44}/>
                <Tooltip formatter={v=>`$${fmt(v)}`} contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,fontSize:11}}/>
                <ReferenceLine y={0} stroke={C.muted}/>
                <Bar dataKey="value" radius={[3,3,0,0]} fill={C.red}/>
              </BarChart>
            </ResponsiveContainer>
          ) : (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No data yet</div>
          )}
        </div>
      )}

      {tab==="trades" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:40}}>
          <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.border}`,fontSize:10,color:C.muted,letterSpacing:"0.1em",textTransform:"uppercase"}}>
            Live Trade Log · {filtered.length} trades
          </div>
          {filtered.length ? (
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                <thead><tr style={{background:C.bg}}>
                  {["#","Pair","Dir","Date","Entry","SL","TP","Exit","Result","P&L","Balance"].map(h=>(
                    <th key={h} style={{padding:"7px 8px",color:C.muted,textAlign:"left",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {filtered.map((t,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`}}>
                      <td style={{padding:"6px 8px",color:C.muted}}>{t.id}</td>
                      <td style={{padding:"6px 8px"}}>{(t.symbol||"").replace("/USDT","")}</td>
                      <td style={{padding:"6px 8px"}}>
                        <span style={{background:t.direction==="LONG"?C.accentDim:C.redDim,color:t.direction==="LONG"?C.accent:C.red,padding:"2px 5px",borderRadius:3,fontSize:8,fontWeight:700}}>{t.direction}</span>
                      </td>
                      <td style={{padding:"6px 8px",color:C.muted,whiteSpace:"nowrap"}}>{fmtDT(t.created_at)}</td>
                      <td style={{padding:"6px 8px"}}>{fmt(t.entry_price,4)}</td>
                      <td style={{padding:"6px 8px",color:C.red}}>{fmt(t.sl_price,4)}</td>
                      <td style={{padding:"6px 8px",color:C.accent}}>{fmt(t.tp_price,4)}</td>
                      <td style={{padding:"6px 8px"}}>{t.exit_price?fmt(t.exit_price,4):"—"}</td>
                      <td style={{padding:"6px 8px",color:t.result==="TP"?C.accent:t.result==="SL"?C.red:C.muted,fontWeight:700}}>{t.result||"OPEN"}</td>
                      <td style={{padding:"6px 8px",color:(t.pnl||0)>=0?C.accent:C.red}}>{(t.pnl||0)>=0?"+":""}${fmt(t.pnl||0)}</td>
                      <td style={{padding:"6px 8px"}}>${fmt(t.balance_after||0)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:12}}>No trades yet</div>
          )}
        </div>
      )}
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
function App() {

  const tabs = [
    ["single",   "Single"],
    ["matrix",   "Matrix"],
    ["compare",  "Compare"],
    ["prefetch", "Prefetch"],
    ["journal",  "Paper"],
    ["live",     "Live"],
  ];

  const tabColor = (id) => {
    if (id==="compare"||id==="prefetch") return C.gold;
    if (id==="live") return C.red;
    if (id==="journal") return C.blue;
    return C.accent;
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,padding:"20px 16px",maxWidth:900,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,boxShadow:`0 0 8px ${C.accent}`}}/>
          <span style={{fontSize:10,color:C.accent,letterSpacing:"0.2em",textTransform:"uppercase"}}>Waddle Fib Engine v8</span>
        </div>
        <h1 style={{fontSize:26,fontWeight:800,letterSpacing:"-0.03em"}}>BACKTEST <span style={{color:C.accent}}>LAB</span></h1>
        <p style={{marginTop:4,fontSize:11,color:C.muted}}>XRP · DOGE · TRX · XLM · ADA · ARB · Fees on notional · 1M · 5M · 15M · 1H · 4H · 1D</p>
      </div>

      <div style={{display:"flex",gap:0,marginBottom:20,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setMainTab(id)} style={{
            flex:1, padding:"12px 8px",
            background:mainTab===id?C.card:"transparent",
            color:mainTab===id?tabColor(id):C.muted,
            border:"none",
            borderBottom:mainTab===id?`2px solid ${tabColor(id)}`:"2px solid transparent",
            fontSize:11, fontWeight:mainTab===id?700:400,
            cursor:"pointer", letterSpacing:"0.08em", textTransform:"uppercase"
          }}>{label}</button>
        ))}
      </div>

      {mainTab==="single"   && <SingleTab/>}
      {mainTab==="matrix"   && <MatrixTab/>}
      {mainTab==="compare"  && <CompareTab/>}
      {mainTab==="prefetch" && <PrefetchTab/>}
      {mainTab==="journal"  && <JournalTab/>}
      {mainTab==="live"     && <LiveJournalTab/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
